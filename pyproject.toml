[project]
name = "vigil-alarm"
version = "0.1.0"
description = "Vigil Alarm: a modular alarm system for Home Assistant"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pyyaml"]

# The core tests import `vigil_core` directly, without Home Assistant installed.
[tool.pytest.ini_options]
pythonpath = [".", "custom_components/vigil"]
testpaths = ["tests"]
asyncio_mode = "auto"
