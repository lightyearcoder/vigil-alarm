blueprint:
  name: Vigil - Arm at a set time
  description: >
    Arms the alarm every day (or on chosen days) at a set time, for example night mode at bedtime.
    If arming is refused you can get a message.


    **Code:** see the note in "Arm when everyone has left". A code filled in here is stored as plain
    text; use a separate Vigil user that may only use this mode.
  domain: automation
  author: lightyearcoder
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/lightyearcoder/vigil-alarm/blob/main/blueprints/automation/vigil_alarm/arm_on_schedule.yaml
  input:
    alarm:
      name: Vigil alarm
      selector:
        entity:
          filter:
            - integration: vigil_alarm
              domain: alarm_control_panel
    time:
      name: Time
      default: "23:00:00"
      selector:
        time:
    days:
      name: Days
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    mode:
      name: Mode
      default: night
      selector:
        select:
          options: [away, home, night, vacation, custom]
    code:
      name: Code (optional)
      default: ""
      selector:
        text:
          type: password
    notify:
      name: Message when arming fails (optional)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: notify

mode: single
max_exceeded: silent

variables:
  alarm: !input alarm
  mode: !input mode
  code: !input code
  notify: !input notify

triggers:
  - trigger: time
    at: !input time

conditions:
  - condition: time
    weekday: !input days
  - condition: state
    entity_id: !input alarm
    state: disarmed

actions:
  - choose:
      - conditions: "{{ mode == 'home' }}"
        sequence:
          - action: alarm_control_panel.alarm_arm_home
            continue_on_error: true
            target:
              entity_id: !input alarm
            data:
              code: "{{ code }}"
      - conditions: "{{ mode == 'night' }}"
        sequence:
          - action: alarm_control_panel.alarm_arm_night
            continue_on_error: true
            target:
              entity_id: !input alarm
            data:
              code: "{{ code }}"
      - conditions: "{{ mode == 'vacation' }}"
        sequence:
          - action: alarm_control_panel.alarm_arm_vacation
            continue_on_error: true
            target:
              entity_id: !input alarm
            data:
              code: "{{ code }}"
      - conditions: "{{ mode == 'custom' }}"
        sequence:
          - action: alarm_control_panel.alarm_arm_custom_bypass
            continue_on_error: true
            target:
              entity_id: !input alarm
            data:
              code: "{{ code }}"
    default:
      - action: alarm_control_panel.alarm_arm_away
        continue_on_error: true
        target:
          entity_id: !input alarm
        data:
          code: "{{ code }}"
  - if:
      - condition: state
        entity_id: !input alarm
        state: disarmed
      - condition: template
        value_template: "{{ notify | count > 0 }}"
    then:
      - alias: Tell that arming failed
        action: notify.send_message
        target:
          entity_id: !input notify
        data:
          title: Alarm not armed
          message: >
            The alarm could not be armed.
            {% set r = state_attr(alarm, 'refuse_reason') %}
            {% if r %}Reason: {{ r | replace('_', ' ') }}.{% endif %}
            {% set o = state_attr(alarm, 'open_sensors') %}
            {% if o %}Open: {{ o | join(', ') }}.{% endif %}
