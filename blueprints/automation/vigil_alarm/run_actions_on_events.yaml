blueprint:
  name: Vigil - Run your own actions on alarm events
  description: >
    The general building block: pick which Vigil events you care about and what should happen.
    In your actions you can use `event_type`, `practice` (true while practice mode is on) and `data` (for example
    `data.cause`, `data.sensor_name`, `data.user`, `data.mode`, `data.reason`).


    This automation tells Vigil Alarm when a run starts and ends, so Vigil can see if one stops early. Choose the
    event `handler_test` to let your actions run during the weekly test with the real actions.
  domain: automation
  author: lightyearcoder
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/lightyearcoder/vigil-alarm/blob/main/blueprints/automation/vigil_alarm/run_actions_on_events.yaml
  input:
    partitions:
      name: Only for these partitions
      description: >
        Pick at least one partition: the actions run for events of those partitions only. Pick the entity for all
        partitions to react to every partition. Events that belong to no partition, and the weekly test, always count.
      selector:
        entity:
          multiple: true
          filter:
            - integration: vigil_alarm
              domain: alarm_control_panel
    events:
      name: Vigil events
      selector:
        entity:
          filter:
            - integration: vigil_alarm
              domain: event
    event_types:
      name: Run on these events
      selector:
        select:
          multiple: true
          options: [armed, arming_started, arm_refused, disarmed, pending_started, triggered, trigger_cause_changed, trigger_ended, sensor_faulted, sensor_unconfirmed, sensor_unconfirmed_escalated, sensor_bypassed, sensor_bypassed_at_arm, sensor_unbypassed, bypass_refused, supervision_lost, supervision_restored, technical_alarm_started, technical_alarm_ended, state_restore_failed, notification_failed, siren_started, siren_stopped, siren_failed, siren_unavailable, siren_available, siren_power_lost, siren_power_restored, battery_low, battery_ok, alarm_silenced, alarm_acknowledged, code_rejected, handler_test]
    actions:
      name: Actions
      selector:
        action:
    in_practice:
      name: Also act in practice mode
      description: >
        In practice mode and in the weekly test with the real actions Vigil keeps its siren and its own messages
        quiet. Switch this on if this automation may still do its work then (lights flashing, say) and off if it
        must stay quiet (speech, a siren, messages). The automation always tells Vigil that it ran.
      default: false
      selector:
        boolean:

mode: queued
max_exceeded: silent

variables:
  event_types: !input event_types
  in_practice: !input in_practice
  partition_pick: !input partitions
  partition_ids: "{{ partition_pick | map('state_attr', 'partition') | select('string') | list }}"
  every_partition: >
    {{ partition_pick | length == 0
       or partition_pick | map('state_attr', 'partitions') | select('mapping') | list | length > 0 }}
  event_partition: "{{ trigger.to_state.attributes.get('partition', '') or '' }}"
  in_scope: "{{ every_partition or event_partition == '' or event_partition in partition_ids }}"
  event_type: "{{ trigger.to_state.attributes.get('event_type', '') }}"
  data: "{{ trigger.to_state.attributes }}"
  practice: "{{ trigger.to_state.attributes.get('practice', false) }}"
  dry_run: "{{ trigger.to_state.attributes.get('dry_run', false) }}"
  is_test: "{{ event_type == 'handler_test' }}"
  run_id: "{{ this.entity_id }}-{{ now().timestamp() }}"
  skip: >
    {{ dry_run or (practice and not in_practice)
       or (is_test and 'handler_test' not in event_types) }}

triggers:
  - trigger: state
    entity_id: !input events

conditions:
  - condition: template
    value_template: "{{ (event_type in event_types and in_scope) or is_test }}"

actions:
  - alias: Tell Vigil this run has started
    action: vigil_alarm.handler_report
    continue_on_error: true
    data:
      run_id: "{{ run_id }}"
      state: started
      handler: "{{ state_attr(this.entity_id, 'friendly_name') or this.entity_id }}"
      automation: "{{ this.entity_id }}"
      event: "{{ event_type }}"
  - alias: Your actions
    if:
      - condition: template
        value_template: "{{ not skip }}"
    then: !input actions
  - alias: Tell Vigil this run is done
    action: vigil_alarm.handler_report
    continue_on_error: true
    data:
      run_id: "{{ run_id }}"
      state: done
      automation: "{{ this.entity_id }}"

