# One sensor row on the sensors page. Included five times by vigil-panel.yaml, with `n` the position
# on the page (0 to 4) and `y` the distance from the top.
obj:
  id: srow_${n}
  width: 456
  height: 62
  align: TOP_MID
  y: ${y}
  radius: 18
  bg_color: 0x141A22
  border_width: 0
  pad_all: 0
  scrollable: false
  widgets:
    - label:
        id: srow_name_${n}
        text: ""
        text_font: montserrat_20
        text_color: 0xE6EAF0
        long_mode: DOT
        width: 290
        align: TOP_LEFT
        x: 16
        y: 8
    - label:
        id: srow_state_${n}
        text: ""
        text_font: montserrat_14
        text_color: 0x8A94A3
        long_mode: DOT
        width: 290
        align: BOTTOM_LEFT
        x: 16
        y: -8
    - button:
        id: srow_btn_${n}
        width: 130
        height: 44
        align: RIGHT_MID
        x: -9
        radius: 14
        bg_color: 0x263041
        shadow_width: 0
        on_click:
          then:
            - script.execute:
                id: tap_row
                slot: ${n}
        widgets:
          - label:
              id: srow_btn_lbl_${n}
              text: ""
              text_font: montserrat_20
              text_color: 0xE6EAF0
              align: CENTER
