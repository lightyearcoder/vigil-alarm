# Vigil Alarm touch panel: the screen, for any ESPHome device with an LVGL display and a touch screen.
#
# This file is the part that is the same for every panel. The hardware (display, touch, backlight)
# is in a second file, for example guition-4848.yaml, and the device itself (name, Wi-Fi, keys) in
# a third, see example-garage.yaml. What the hardware file must provide:
#   - a light with the id `display_backlight`
#   - an `lvgl:` with the `touchscreens:` (and the display) of the panel
#   - the touch screen calls `script.execute: wake` when touched
#
# What the panel shows follows Home Assistant, not this file: the buttons for Home, Away and Night
# are there only if that mode is switched on in Vigil, a code is asked only when Vigil asks for one
# to arm, and disarming always asks for a code.
#
# Every panel is a control point of its own: `source` is shown in the history of Vigil as who did it.

substitutions:
  # The Vigil alarm entity. Only change this if you renamed it.
  alarm_entity: alarm_control_panel.vigil_alarm
  # Shown in the history of Vigil, for example "Anna (panel garage)". Give every panel its own.
  source: panel
  # The language the panel starts in, until someone changes it on the panel: 0 = Nederlands, 1 = English
  language: "0"
  # Allow sensors to be bypassed on the panel? "true" or "false"
  allow_bypass: "true"
  # Who may see the list of sensors on the panel (and which sensor tripped, and who armed):
  #   code   = only after a code, for sensor_unlock (default; a thief at the panel learns nothing)
  #   always = everyone
  #   never  = nobody, the Sensors button is gone
  sensor_list: code
  sensor_unlock: 60s
  # The screen goes dark after this time without touch, and back to the main page.
  backlight_timeout: 30s
  idle_timeout: 30s

esphome:
  includes:
    - vigil_panel.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          vigil::ctx.lang = id(lang);
          vigil::ctx.sensor_list = vigil::parse_sensor_list("${sensor_list}");
      - script.execute: refresh_texts
      - script.execute: refresh_ui
      - script.execute: wake

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: lang  # 0 = Nederlands, 1 = English; remembered over a restart
    type: int
    restore_value: true
    initial_value: ${language}
  - id: pending_action  # what the keypad is for, see Action in vigil_panel.h
    type: int
    initial_value: "0"
  - id: pending_entity  # the sensor for a bypass
    type: std::string
  - id: pending_name
    type: std::string
  - id: keypad_open
    type: bool
    initial_value: "false"
  - id: on_sensors_page  # is the list of sensors on the screen?
    type: bool
    initial_value: "false"
  - id: unlock_code  # the code that unlocked the list, kept in memory for a moment, never stored
    type: std::string
  - id: sens_page  # the page of the sensors list, from 0
    type: int
    initial_value: "0"

# ----------------------------------------------------------------- what Home Assistant tells us
text_sensor:
  - platform: homeassistant
    id: ha_state
    entity_id: ${alarm_entity}
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.state = x;
        - script.execute: wake
        - script.execute: refresh_ui
        - script.execute: route
  - platform: homeassistant
    id: ha_mode
    entity_id: ${alarm_entity}
    attribute: mode
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.mode = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_features
    entity_id: ${alarm_entity}
    attribute: supported_features
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.features = (int) vigil::parse_number(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_code_arm_required
    entity_id: ${alarm_entity}
    attribute: code_arm_required
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.code_arm_required = vigil::truthy(x);
  - platform: homeassistant
    id: ha_delay_end
    entity_id: ${alarm_entity}
    attribute: delay_end
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.delay_end = vigil::parse_number(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_changed_by
    entity_id: ${alarm_entity}
    attribute: changed_by
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.changed_by = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_cause
    entity_id: ${alarm_entity}
    attribute: cause
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.cause = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_cause_sensor
    entity_id: ${alarm_entity}
    attribute: cause_sensor
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.cause_sensor = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_open_now
    entity_id: ${alarm_entity}
    attribute: open_now_text
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.open_now = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_open_mode
    entity_id: ${alarm_entity}
    attribute: open_sensors_text
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.open_mode = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_faults
    entity_id: ${alarm_entity}
    attribute: faults_text
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.faults = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_problems
    entity_id: ${alarm_entity}
    attribute: problems_count
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.problems = (int) vigil::parse_number(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_sensors
    entity_id: ${alarm_entity}
    attribute: panel_sensors
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.sensors = vigil::clean(x);
        - script.execute: refresh_ui
        - script.execute: refresh_sensors
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true
      on_value:
        - script.execute: refresh_texts

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    internal: true
    update_interval: 10s
    on_value:
      - script.execute: refresh_texts
  - platform: uptime
    id: uptime_s
    internal: true
    update_interval: 30s
    on_value:
      - script.execute: refresh_texts

interval:
  # The clock, and the countdown of the exit or entry delay.
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          vigil::ctx.now = t.is_valid() ? (double) t.timestamp : NAN;
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            auto t = id(ha_time).now();
            return t.is_valid() ? t.strftime("%H:%M") : std::string("--:--");
      - if:
          condition:
            lambda: return vigil::ctx.state == "arming" || vigil::ctx.state == "pending";
          then:
            - script.execute: refresh_ui
  # Is Home Assistant there? Only "connected" for Home Assistant itself, not for a log viewer.
  - interval: 5s
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - script.execute:
                id: set_connected
                up: true
          else:
            - script.execute:
                id: set_connected
                up: false

# ------------------------------------------------------------------------------------- scripts
script:
  # The screen on, and off again after a while without touch.
  - id: wake
    mode: restart
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - delay: ${backlight_timeout}
      - light.turn_off: display_backlight

  - id: set_connected
    parameters:
      up: bool
    then:
      - if:
          condition:
            lambda: return vigil::ctx.ha_connected != up;
          then:
            - lambda: vigil::ctx.ha_connected = up;
            - script.execute: refresh_ui
            - script.execute: refresh_texts

  # The main page.
  - id: refresh_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_state
          text: !lambda 'return vigil::state_title();'
      - lvgl.label.update:
          id: lbl_sub
          text: !lambda 'return vigil::state_sub(vigil::ctx.now);'
      - lvgl.obj.update:
          id: card_state
          bg_color: !lambda 'return lv_color_hex(vigil::state_color());'
      - lvgl.label.update:
          id: lbl_conn
          text: !lambda 'return std::string(vigil::ctx.ha_connected ? "HA" : "HA ?");'
      - lvgl.label.update:
          id: lbl_sensors_btn
          text: !lambda 'return vigil::sensors_button_text();'
      - if:
          condition:
            lambda: return vigil::show_sensors_button();
          then:
            - lvgl.widget.show: btn_sensors
          else:
            - lvgl.widget.hide: btn_sensors
      - if:
          condition:
            lambda: return vigil::show_home();
          then:
            - lvgl.widget.show: btn_home
          else:
            - lvgl.widget.hide: btn_home
      - if:
          condition:
            lambda: return vigil::show_away();
          then:
            - lvgl.widget.show: btn_away
          else:
            - lvgl.widget.hide: btn_away
      - if:
          condition:
            lambda: return vigil::show_night();
          then:
            - lvgl.widget.show: btn_night
          else:
            - lvgl.widget.hide: btn_night
      - if:
          condition:
            lambda: return vigil::show_disarm();
          then:
            - lvgl.widget.show: btn_disarm
          else:
            - lvgl.widget.hide: btn_disarm

  # The texts that do not change with the alarm: they change with the language.
  - id: refresh_texts
    then:
      - lvgl.label.update:
          id: lbl_btn_home
          text: !lambda 'return vigil::tr("home");'
      - lvgl.label.update:
          id: lbl_btn_away
          text: !lambda 'return vigil::tr("away");'
      - lvgl.label.update:
          id: lbl_btn_night
          text: !lambda 'return vigil::tr("night");'
      - lvgl.label.update:
          id: lbl_btn_disarm
          text: !lambda 'return vigil::tr("disarm");'
      - lvgl.label.update:
          id: lbl_sens_title
          text: !lambda 'return vigil::tr("sensors");'
      - lvgl.label.update:
          id: lbl_set_title
          text: !lambda 'return vigil::tr("settings");'
      - lvgl.label.update:
          id: lbl_set_language
          text: !lambda 'return vigil::tr("language");'
      - lvgl.label.update:
          id: lbl_info_conn
          text: !lambda 'return vigil::ctx.ha_connected ? vigil::tr("connected") : vigil::tr("not_connected");'
      - lvgl.label.update:
          id: lbl_info_ip
          text: !lambda 'return std::string("IP: ") + id(wifi_ip).state;'
      - lvgl.label.update:
          id: lbl_info_wifi
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f dBm", id(wifi_rssi).state);
            return vigil::tr("signal") + buf;
      - lvgl.label.update:
          id: lbl_info_up
          text: !lambda |-
            return vigil::tr("uptime") + std::to_string((int) (id(uptime_s).state / 60)) + vigil::tr("minutes");
      - lvgl.obj.update:
          id: btn_lang_0
          bg_color: !lambda 'return lv_color_hex(vigil::ctx.lang == 0 ? 0x2563EB : 0x1C2430);'
      - lvgl.obj.update:
          id: btn_lang_1
          bg_color: !lambda 'return lv_color_hex(vigil::ctx.lang == 1 ? 0x2563EB : 0x1C2430);'
      - script.execute: refresh_ui
      - script.execute: refresh_sensors

  # The sensors page.
  - id: refresh_sensors
    then:
      - lambda: |-
          int last = vigil::page_count() - 1;
          if (id(sens_page) > last) id(sens_page) = last;
      - lvgl.label.update:
          id: lbl_pager
          text: !lambda |-
            if (vigil::sensor_count() == 0) return vigil::tr("no_sensors");
            return std::to_string(id(sens_page) + 1) + " / " + std::to_string(vigil::page_count());
      - script.execute: row_update_0
      - script.execute: row_update_1
      - script.execute: row_update_2
      - script.execute: row_update_3
      - script.execute: row_update_4
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 0}}
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 1}}
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 2}}
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 3}}
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 4}}

  - id: sensors_page_step
    parameters:
      step: int
    then:
      - lambda: |-
          int page = id(sens_page) + step;
          int last = vigil::page_count() - 1;
          id(sens_page) = page < 0 ? 0 : (page > last ? last : page);
      - script.execute: refresh_sensors

  # A tap on the button of a sensor: bypass it, or restore it if it was bypassed.
  - id: tap_row
    parameters:
      slot: int
    then:
      - lambda: |-
          auto row = vigil::row_at(id(sens_page), slot);
          id(pending_entity) = row.entity;
          id(pending_name) = row.name;
          id(pending_action) = vigil::is_bypassed(row.status) ? vigil::UNBYPASS : vigil::BYPASS;
      - script.execute: start_action

  # The Sensors button: straight to the list, or first a code, depending on `sensor_list`.
  - id: open_sensors
    then:
      - if:
          condition:
            lambda: return vigil::sensors_visible();
          then:
            - script.execute: show_sensors
          else:
            - lambda: |-
                id(pending_entity) = "";
                id(pending_name) = "";
                id(pending_action) = vigil::UNLOCK;
            - script.execute: start_action

  - id: show_sensors
    then:
      - lambda: id(on_sensors_page) = true;
      - script.execute: refresh_sensors
      - lvgl.page.show: page_sensors

  # Forget the code and close the list, now or when the time is up.
  - id: lock_sensors
    then:
      - lambda: |-
          vigil::ctx.sensors_unlocked = false;
          id(unlock_code) = "";
      - if:
          condition:
            lambda: return id(on_sensors_page);
          then:
            - lambda: id(on_sensors_page) = false;
            - lvgl.page.show: page_main
      - script.execute: refresh_ui

  - id: unlock_timer
    mode: restart
    then:
      - delay: ${sensor_unlock}
      - script.execute: lock_sensors

  # An action was chosen: ask for the code if that is needed, otherwise do it straight away.
  - id: start_action
    then:
      - if:
          condition:
            lambda: return vigil::needs_code(id(pending_action));
          then:
            - script.execute: open_keypad
          else:
            - script.execute: run_action

  - id: open_keypad
    then:
      - lambda: |-
          id(keypad_open) = true;
          id(on_sensors_page) = false;
          // Stars only, and never the digit itself, not even for a moment.
          lv_textarea_set_password_show_time(id(pin_text), 0);
          lv_textarea_set_password_bullet(id(pin_text), "*");
      - lvgl.label.update:
          id: lbl_kp_title
          text: !lambda 'return vigil::keypad_title(id(pending_action), id(pending_name));'
      - lvgl.label.update:
          id: lbl_kp_err
          text: ""
      - lvgl.textarea.update:
          id: pin_text
          text: ""
      - lvgl.page.show: page_keypad

  - id: close_keypad
    then:
      - lambda: |-
          id(keypad_open) = false;
          id(pending_action) = 0;
          id(on_sensors_page) = false;
      - lvgl.textarea.update:
          id: pin_text
          text: ""
      - lvgl.page.show: page_main

  # The keypad should open, or close, because of what the alarm is doing.
  - id: route
    then:
      - if:
          condition:
            lambda: return vigil::keypad_route(id(keypad_open), id(pending_action)) == 1;
          then:
            - lambda: |-
                id(pending_action) = vigil::DISARM;
                id(pending_entity) = "";
            - script.execute: open_keypad
      - if:
          condition:
            lambda: return vigil::keypad_route(id(keypad_open), id(pending_action)) == 2;
          then:
            - script.execute: close_keypad

  - id: add_digit
    mode: parallel
    parameters:
      d: string
    then:
      - lambda: lv_textarea_add_text(id(pin_text), d.c_str());

  - id: delete_digit
    then:
      - lambda: lv_textarea_delete_char(id(pin_text));

  # Do the action. The result decides what the screen does next.
  - id: run_action
    then:
      - if:
          condition:
            lambda: return id(pending_action) >= vigil::ARM_HOME && id(pending_action) <= vigil::ARM_NIGHT;
          then:
            - homeassistant.action:
                action: vigil_alarm.arm
                data:
                  mode: !lambda |-
                    return id(pending_action) == vigil::ARM_HOME ? "home" : (id(pending_action) == vigil::ARM_AWAY ? "away" : "night");
                  source: ${source}
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'
      - if:
          condition:
            lambda: return id(pending_action) == vigil::DISARM;
          then:
            - homeassistant.action:
                action: vigil_alarm.disarm
                data:
                  source: ${source}
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'
      - if:
          condition:
            lambda: return id(pending_action) == vigil::UNLOCK;
          then:
            - homeassistant.action:
                action: vigil_alarm.check_code
                data:
                  source: ${source}
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'
      - if:
          condition:
            lambda: return id(pending_action) == vigil::BYPASS;
          then:
            - homeassistant.action:
                action: vigil_alarm.bypass
                data:
                  sensor: !lambda 'return id(pending_entity);'
                  source: ${source}
                  code: !lambda 'return vigil::ctx.sensors_unlocked ? id(unlock_code) : std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'
      - if:
          condition:
            lambda: return id(pending_action) == vigil::UNBYPASS;
          then:
            - homeassistant.action:
                action: vigil_alarm.unbypass
                data:
                  sensor: !lambda 'return id(pending_entity);'
                  source: ${source}
                  code: !lambda 'return vigil::ctx.sensors_unlocked ? id(unlock_code) : std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'

  - id: action_done
    then:
      - lambda: vigil::ctx.message = "";
      - if:
          condition:
            lambda: return id(pending_action) == vigil::UNLOCK;
          then:
            # The code was right: keep it in memory for a moment, so bypassing needs no second code.
            - lambda: |-
                id(unlock_code) = std::string(lv_textarea_get_text(id(pin_text)));
                vigil::ctx.sensors_unlocked = true;
                id(keypad_open) = false;
                id(pending_action) = 0;
            - lvgl.textarea.update:
                id: pin_text
                text: ""
            - script.execute: unlock_timer
            - script.execute: show_sensors
      - if:
          condition:
            lambda: return id(pending_action) == vigil::BYPASS || id(pending_action) == vigil::UNBYPASS;
          then:
            - lambda: |-
                id(keypad_open) = false;
                id(pending_action) = 0;
                id(on_sensors_page) = true;
            - lvgl.textarea.update:
                id: pin_text
                text: ""
            - lvgl.page.show: page_sensors
          else:
            - if:
                condition:
                  lambda: return id(pending_action) != 0;
                then:
                  - script.execute: close_keypad
      - script.execute: refresh_ui

  # The error is shown on the keypad, or on the main page if there was no keypad.
  - id: action_failed
    parameters:
      message: string
    then:
      - lambda: vigil::ctx.message = message;
      - lvgl.textarea.update:
          id: pin_text
          text: ""
      - if:
          condition:
            lambda: return id(keypad_open);
          then:
            - lvgl.label.update:
                id: lbl_kp_err
                text: !lambda 'return message;'
          else:
            - lvgl.page.show: page_main
      - script.execute: refresh_ui
      - script.execute: clear_message

  - id: clear_message
    mode: restart
    then:
      - delay: 8s
      - lambda: vigil::ctx.message = "";
      - lvgl.label.update:
          id: lbl_kp_err
          text: ""
      - script.execute: refresh_ui

# --------------------------------------------------------------------------------------- screen
lvgl:
  default_font: montserrat_20
  text_color: 0xE6EAF0
  bg_color: 0x0B0F14
  # After a while without touch: forget the code and go back to the main page. Is someone still
  # supposed to disarm, then the keypad comes back.
  on_idle:
    timeout: ${idle_timeout}
    then:
      - lambda: |-
          id(keypad_open) = false;
          id(pending_action) = 0;
          id(sens_page) = 0;
          id(on_sensors_page) = false;
          vigil::ctx.sensors_unlocked = false;  // forget the code
          id(unlock_code) = "";
      - lvgl.textarea.update:
          id: pin_text
          text: ""
      - lvgl.page.show: page_main
      - script.execute: route
  pages:
    # ================================================================== MAIN
    - id: page_main
      bg_color: 0x0B0F14
      scrollable: false
      widgets:
        - label:
            id: lbl_time
            text: "--:--"
            text_font: montserrat_28
            text_color: 0xAAB4C3
            align: TOP_LEFT
            x: 20
            y: 16
        - label:
            id: lbl_conn
            text: "HA ?"
            text_font: montserrat_14
            text_color: 0x64748B
            align: TOP_LEFT
            x: 120
            y: 24
        - button:
            id: btn_settings
            width: 52
            height: 52
            align: TOP_RIGHT
            x: -14
            y: 8
            radius: 26
            bg_color: 0x1C2430
            shadow_width: 0
            on_click:
              then:
                - lvgl.page.show: page_settings
            widgets:
              - label:
                  text: ""
                  text_color: 0xAAB4C3
                  align: CENTER
        # The state
        - obj:
            id: card_state
            width: 456
            height: 210
            align: TOP_MID
            y: 70
            radius: 28
            bg_color: 0x475569
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: lbl_state
                  text: ""
                  text_font: montserrat_40
                  text_color: 0xFFFFFF
                  align: TOP_MID
                  y: 36
              - label:
                  id: lbl_sub
                  text: ""
                  text_font: montserrat_20
