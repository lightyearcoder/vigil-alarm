# Example of a Vigil panel: a Guition 4848 in the garage. Copy this file, the files next to it
# (guition-4848.yaml, vigil-panel.yaml, vigil-panel-row.yaml, vigil-panel-row-script.yaml and
# vigil_panel.h) into your ESPHome folder and change the name. For a second panel copy this file
# again with another name and another `source`.
#
# In Home Assistant, switch on "Allow the device to perform Home Assistant actions" for this
# device (Settings > Devices & services > ESPHome > the device > Configure). Without it, the buttons
# do nothing.

substitutions:
  name: vigil-panel-garage
  friendly_name: Vigil panel garage
  # How this panel is called in the Vigil history, for example "Anna (panel garage)".
  source: panel garage
  # alarm_entity: alarm_control_panel.vigil_alarm   # only if you renamed it
  # language: "1"                                   # 0 = Nederlands (default), 1 = English
  # allow_bypass: "false"                           # no bypass on this panel
  # sensor_list: always                             # code (default) | always | never
  # backlight_timeout: 60s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  hardware: !include guition-4848.yaml
  vigil: !include vigil-panel.yaml

api:
  encryption:
    key: !secret vigil_panel_garage_encryption_key

ota:
  - platform: esphome
    password: !secret vigil_panel_garage_ota_password  # without it anyone on your network can flash the panel
    on_begin:  # stops the screen from flickering during an update
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
