# Example of a Vigil panel: a Guition 4848 in the garage. Copy this file and the
# folder `vigil_alarm` (the firmware and the hardware file guition-4848.yaml) into your ESPHome
# folder and change the name. For a
# second panel copy this file again with another name.
#
# Then add the panel in Vigil (Panels): the panel id is the device name below. Everything the panel
# may do (modes, disarm, bypass, sensor list, language) is set there, not here. Until it is added the
# panel shows "Not linked".
#
# In Home Assistant, switch on "Allow the device to perform Home Assistant actions" for this
# device (Settings > Devices & services > ESPHome > the device > Configure). Without it, the buttons
# do nothing.

substitutions:
  name: vigil-panel-garage      # the panel id in Vigil: lower case letters, digits and dashes
  friendly_name: Vigil panel garage
  # backlight_timeout_seconds: "60"   # only until Vigil has told the panel (setting in Vigil)
  # The key of this panel: make it in Vigil (Panels, the key button of this panel) and put it in secrets.yaml. The panel
  # sends it with every call, and Vigil refuses calls in the name of this panel without it.
  # panel_key: !secret vigil_panel_garage_key   # remove the # once you have made the key and put it in secrets.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  hardware: !include vigil_alarm/guition-4848.yaml
  vigil: !include vigil_alarm/vigil-panel.yaml

api:
  encryption:
    key: !secret vigil_panel_garage_encryption_key

ota:
  - platform: esphome
    encryption: {}  # uploads use the key of the api above: only whoever has the key can flash the panel
    on_begin:  # stops the screen from flickering during an update
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
