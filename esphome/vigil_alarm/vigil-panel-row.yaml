# One sensor row on the sensors page. Included five times by vigil-panel.yaml, with `n` the position
# on the page (0 to 4) and `y` the distance from the top.
obj:
  id: srow_${n}
  width: ${content_w}
  height: 56
  align: TOP_MID
  y: ${y}
  radius: 18
  bg_color: 0x151A22
  border_width: 1
  border_color: 0x232A35
  shadow_width: 0
  pad_all: 0
  scrollable: false
  widgets:
    - obj:
        id: srow_dot_${n}
        width: 12
        height: 12
        radius: 6
        bg_color: 0x4CCB8F
        border_width: 0
        shadow_width: 0
        pad_all: 0
        clickable: false
        scrollable: false
        align: LEFT_MID
        x: 16
    - label:
        id: srow_name_${n}
        text: ""
        text_font: montserrat_20
        text_color: 0xE8ECF2
        long_mode: DOT
        width: ${ content_w | int - 190 }
        align: TOP_LEFT
        x: 40
        y: 6
    - label:
        id: srow_state_${n}
        text: ""
        text_font: montserrat_14
        text_color: 0x8A94A6
        long_mode: DOT
        width: ${ content_w | int - 190 }
        align: BOTTOM_LEFT
        x: 40
        y: -6
    - button:
        id: srow_btn_${n}
        width: 130
        height: 40
        align: RIGHT_MID
        x: -8
        radius: 20
        bg_color: 0x1E242D
        border_width: 1
        border_color: 0x2C3542
        shadow_width: 0
        pressed:
          bg_color: 0x2A3340
        on_click:
          then:
            - script.execute:
                id: tap_row
                slot: ${n}
        widgets:
          - label:
              id: srow_btn_lbl_${n}
              text: ""
              text_font: montserrat_14
              text_color: 0xE8ECF2
              align: CENTER
