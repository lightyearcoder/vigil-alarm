                  radius: 18
                  bg_color: 0x1E242D
                  border_width: 1
                  border_color: 0x2C3542
                  shadow_width: 0
                  pressed:
                    bg_color: 0x2A3340
                  on_press: {then: [{script.execute: {id: add_digit, d: "7"}}]}
                  widgets:
                    - label: {text: "7", text_font: montserrat_40, text_color: 0xE8ECF2, align: CENTER}
              - button:
