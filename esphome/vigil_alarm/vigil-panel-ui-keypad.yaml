                  shadow_width: 0
                  pressed:
                    bg_color: 0x2A3340
                  on_press: {then: [{script.execute: delete_digit}]}
                  widgets:
                    - label: {text: "\U000F0B5C", text_font: font_icons_30, text_color: 0xC5CCD8, align: CENTER}
              - button:
                  width: ${key_w}
