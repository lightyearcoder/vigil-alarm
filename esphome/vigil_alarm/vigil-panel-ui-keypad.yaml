                  widgets:
                    - label: {text: "0", text_font: montserrat_40, text_color: 0xE8ECF2, align: CENTER}
              - button:
                  id: key_ok
                  width: ${key_w}
                  height: ${key_h}
                  radius: 18
                  bg_color: 0x4CCB8F
                  border_width: 0
                  shadow_width: 0
                  pressed:
                    bg_color: 0x3DB57C
                  on_press: {then: [{lambda: 'vigil::request_sound(vigil::SOUND_KEY_OK, vigil::ctx.state == "armed_night");'}, {script.execute: run_action}]}
                  widgets:
                    - label: {text: "\U000F012C", text_font: font_icons_30, text_color: 0x07251A, align: CENTER}
