                flex_grow: 1
                bg_opa: TRANSP
                shadow_width: 0
                radius: 0
                layout:
                  type: flex
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  flex_align_track: CENTER
                on_click:
                  then:
                    - script.execute: lock_sensors
                widgets:
