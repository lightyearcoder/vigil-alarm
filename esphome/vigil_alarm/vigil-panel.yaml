# Vigil Alarm touch panel: the screen, for any ESPHome device with an LVGL display and a touch screen.
#
# This file is the part that is the same for every panel. The hardware (display, touch, backlight)
# is in a second file, for example guition-4848.yaml, and the device itself (name, Wi-Fi, keys) in
# a third, see ../example-garage.yaml. What the hardware file must provide:
#   - the substitutions `hardware_id`, `screen_width` and `screen_height`
#   - a light with the id `display_backlight`
#   - an `lvgl:` with the `touchscreens:` (and the display) of the panel
#   - the touch screen calls `script.execute: wake` when touched (the touch that wakes a dark
#     screen is then not passed on to the button under the finger)
#
# Nothing about what the panel may do is set here. The panel is added in Vigil (Panels), with the
# ESPHome device name as panel id, and reads its profile from the sensor Vigil makes for it: which
# modes there are, whether it may disarm or bypass, whether it may show the sensors, the language.
# The device name is also the source shown in the history: "Anna (vigil-panel-garage)".

substitutions:
  # The Vigil alarm entity. Only change this if you renamed it.
  alarm_entity: alarm_control_panel.vigil_alarm
  # The profile sensor Vigil makes for this panel: the panel id (the device name) with underscores.
  profile_entity: sensor.${ name | replace("-", "_") }_profile
  # How long the screen stays on without touch, until Vigil has told the panel (setting "Screen off after" in Vigil).
  backlight_timeout_seconds: "30"
  # The version of this firmware, reported to Vigil.
  firmware_version: "0.4.0"
  # The width of the cards and buttons: the screen minus a margin on both sides.
  content_w: ${ screen_width | int - 24 }

esphome:
  includes:
    - vigil_panel.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          vigil::ctx.device_name = "${name}";
      - script.execute: refresh_texts
      - script.execute: refresh_ui
      - script.execute: wake

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: pending_action  # what the keypad is for, see Action in vigil_panel.h
    type: int
    initial_value: "0"
  - id: pending_entity  # the sensor for a bypass
    type: std::string
  - id: pending_name
    type: std::string
  - id: keypad_open
    type: bool
    initial_value: "false"
  - id: on_sensors_page  # is the list of sensors on the screen?
    type: bool
    initial_value: "false"
  - id: on_info_page  # is the info page on the screen?
    type: bool
    initial_value: "false"
  - id: screen_off_ms  # how long the screen stays on without touch, from Vigil
    type: int
    initial_value: "${backlight_timeout_seconds} * 1000"
  - id: unlock_ms  # how long the list and the info stay open after the installer code, from the profile
    type: int
    initial_value: "60000"
  - id: sens_page  # the page of the sensors list, from 0
    type: int
    initial_value: "0"

# ----------------------------------------------------------------- what Home Assistant tells us
text_sensor:
  # ---- the profile of this panel (a sensor Vigil makes; its state is the version of the profile)
  - platform: homeassistant
    id: ha_profile
    entity_id: ${profile_entity}
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.profile_version = vigil::to_int(x, 0);
        - script.execute: refresh_texts
  - platform: homeassistant
    id: ha_profile_language
    entity_id: ${profile_entity}
    attribute: language
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.lang = vigil::parse_language(x);
        - script.execute: refresh_texts
  - platform: homeassistant
    id: ha_profile_blocked
    entity_id: ${profile_entity}
    attribute: blocked
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.blocked = vigil::truthy(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_modes
    entity_id: ${profile_entity}
    attribute: modes_mask
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.modes_mask = vigil::to_int(x, 0);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_can_disarm
    entity_id: ${profile_entity}
    attribute: can_disarm
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.can_disarm = vigil::truthy(x);
        - script.execute: refresh_ui
        - script.execute: route
  - platform: homeassistant
    id: ha_profile_can_bypass
    entity_id: ${profile_entity}
    attribute: can_bypass
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.can_bypass = vigil::truthy(x);
        - script.execute: refresh_sensors
  - platform: homeassistant
    id: ha_profile_sensor_list
    entity_id: ${profile_entity}
    attribute: sensor_list
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.sensor_list = vigil::parse_sensor_list(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_unlock_seconds
    entity_id: ${profile_entity}
    attribute: unlock_seconds
    internal: true
    on_value:
      then:
        - lambda: id(unlock_ms) = vigil::to_int(x, 60) * 1000;
  - platform: homeassistant
    id: ha_profile_screen_off_seconds
    entity_id: ${profile_entity}
    attribute: screen_off_seconds
    internal: true
    on_value:
      then:
        - lambda: |-
            int seconds = vigil::to_int(x, 30);
            id(screen_off_ms) = (seconds < 5 ? 5 : seconds) * 1000;
  - platform: homeassistant
    id: ha_profile_screen_off_on_alarm
    entity_id: ${profile_entity}
    attribute: screen_off_on_alarm
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.screen_off_on_alarm = vigil::truthy(x);
  - platform: homeassistant
    id: ha_profile_code_arm_required
    entity_id: ${profile_entity}
    attribute: code_arm_required
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.code_arm_required = vigil::truthy(x);
  - platform: homeassistant
    id: ha_profile_has_admin_code
    entity_id: ${profile_entity}
    attribute: has_admin_code
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.has_admin_code = vigil::truthy(x);
  - platform: homeassistant
    id: ha_profile_unlocked
    entity_id: ${profile_entity}
    attribute: unlocked
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.profile_unlocked = vigil::truthy(x);
        - if:
            condition:
              lambda: return !vigil::ctx.profile_unlocked;
            then:
              - script.execute: lock_sensors
            else:
              - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_open_total
    entity_id: ${profile_entity}
    attribute: open_count
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.open_total = vigil::to_int(x, 0);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_faults_total
    entity_id: ${profile_entity}
    attribute: faults_count
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.faults_total = vigil::to_int(x, 0);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_problems
    entity_id: ${profile_entity}
    attribute: problems_count
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.problems = vigil::to_int(x, 0);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_open_now
    entity_id: ${profile_entity}
    attribute: open_now_text
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.open_now = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_open_mode
    entity_id: ${profile_entity}
    attribute: open_sensors_text
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.open_mode = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_faults
    entity_id: ${profile_entity}
    attribute: faults_text
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.faults = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_sensors
    entity_id: ${profile_entity}
    attribute: sensors
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.sensors = vigil::clean(x);
        - script.execute: refresh_ui
        - script.execute: refresh_sensors
  # ---- the alarm itself
  - platform: homeassistant
    id: ha_state
    entity_id: ${alarm_entity}
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.state = x;
        - script.execute: wake_event
        - script.execute: refresh_ui
        - script.execute: route
  - platform: homeassistant
    id: ha_mode
    entity_id: ${alarm_entity}
    attribute: mode
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.mode = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_delay_left
    entity_id: ${alarm_entity}
    attribute: delay_left
    internal: true
    on_value:
      then:
        # Seconds left, counted from the clock of this panel: a clock that is off does not matter.
        - lambda: |-
            auto t = id(ha_time).now();
            double left = vigil::parse_number(x);
            vigil::ctx.delay_end = (std::isnan(left) || !t.is_valid()) ? NAN : (double) t.timestamp + left;
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_changed_by
    entity_id: ${alarm_entity}
    attribute: changed_by
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.changed_by = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_cause
    entity_id: ${alarm_entity}
    attribute: cause
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.cause = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_cause_sensor
    entity_id: ${alarm_entity}
    attribute: cause_sensor
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.cause_sensor = vigil::clean(x);
        - script.execute: refresh_ui
  # ---- what this panel tells Vigil about itself (Vigil reads these by name, see PanelRegistry)
  - platform: template
    name: Hardware ID
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return std::string("${hardware_id}");'
  - platform: template
    name: Capabilities
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return std::string("lvgl,touch,${screen_width}x${screen_height}");'
  - platform: template
    name: Firmware version
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return std::string("${firmware_version}");'
  - platform: template
    name: Profile version
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return std::to_string(vigil::PROFILE_VERSION);'
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true
      on_value:
        - script.execute: refresh_texts

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    internal: true
    update_interval: 10s
    on_value:
      - script.execute: refresh_texts
  - platform: uptime
    id: uptime_s
    internal: true
    update_interval: 30s
    on_value:
      - script.execute: refresh_texts

interval:
  # The clock, and the countdown of the exit or entry delay.
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          vigil::ctx.now = t.is_valid() ? (double) t.timestamp : NAN;
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            auto t = id(ha_time).now();
            return t.is_valid() ? t.strftime("%H:%M") : std::string("--:--");
      - if:
          condition:
            lambda: return vigil::ctx.state == "arming" || vigil::ctx.state == "pending";
          then:
            - script.execute: refresh_ui
  # Is Home Assistant there? Only "connected" for Home Assistant itself, not for a log viewer.
  - interval: 5s
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - script.execute:
                id: set_connected
                up: true
          else:
            - script.execute:
                id: set_connected
                up: false

# ------------------------------------------------------------------------------------- scripts
script:
  # The screen on, and off again after a while without touch. As long as the screen is dark a see-through shield
  # lies over everything (see `top_layer` below), so the touch that wakes the panel does not also press the button
  # under the finger. The shield goes when that finger is lifted. `wake` and `wake_touch` are the same thing, so a
  # hardware file that still calls `wake` on touch works too.
  # The screen is on after a touch, or because the alarm changed. After the screen-off time without touch:
  #  1. a half typed code, the list or the info is still open? Back to the main page (visible), and wait once more;
  #  2. the alarm is counting down, or going off and Vigil says the screen must stay on? Then stay on. The state
  #     changing again starts this script again;
  #  3. otherwise the screen goes dark.
  - id: wake
    mode: restart
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - delay: !lambda 'return id(screen_off_ms);'
      - if:
          condition:
            lambda: return id(keypad_open) || id(on_sensors_page) || id(on_info_page);
          then:
            - script.execute: reset_ui
            - delay: !lambda 'return id(screen_off_ms);'
      - if:
          condition:
            lambda: return !vigil::screen_may_sleep();
          then:
            - script.stop: wake
      - light.turn_off: display_backlight
      - lvgl.widget.show: wake_shield
      # The backlight fades out (transition of the light, 1 s). Wait until it is really dark before touching the
      # screen again, so nobody sees it change.
      - delay: 1500ms
      - script.execute: reset_ui

  - id: reset_ui
    then:
      - lambda: |-
          id(keypad_open) = false;
          id(pending_action) = 0;
          id(sens_page) = 0;
          id(on_sensors_page) = false;
          id(on_info_page) = false;
          vigil::ctx.sensors_unlocked = false;  // the panel forgets the unlock
          vigil::ctx.installer_unlocked = false;
      - lvgl.textarea.update:
          id: pin_text
          text: ""
      - lvgl.page.show: page_main
      - script.execute: route

  - id: wake_touch
    then:
      - script.execute: wake

  # The screen on for another reason than a touch (the alarm changed, start-up): no shield, a touch counts at once.
  - id: wake_event
    then:
      - lvgl.widget.hide: wake_shield
      - script.execute: wake

  - id: set_connected
    parameters:
      up: bool
    then:
      - if:
          condition:
            lambda: return vigil::ctx.ha_connected != up;
          then:
            - lambda: vigil::ctx.ha_connected = up;
            - script.execute: refresh_ui
            - script.execute: refresh_texts

  # The main page.
  - id: refresh_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_state
          text: !lambda 'return vigil::state_title();'
      - lvgl.label.update:
          id: lbl_sub
          text: !lambda 'return vigil::state_sub(vigil::ctx.now);'
      - lvgl.obj.update:
          id: card_state
          bg_color: !lambda 'return lv_color_hex(vigil::state_color());'
      - lvgl.label.update:
          id: lbl_conn
          text: !lambda 'return std::string(vigil::ctx.ha_connected ? "HA" : "HA ?");'
      - lvgl.label.update:
          id: lbl_sensors_btn
          text: !lambda 'return vigil::sensors_button_text();'
      - if:
          condition:
            lambda: return vigil::show_sensors_button();
          then:
            - lvgl.widget.show: btn_sensors
          else:
            - lvgl.widget.hide: btn_sensors
      - if:
          condition:
            lambda: return vigil::show_home();
          then:
            - lvgl.widget.show: btn_home
          else:
            - lvgl.widget.hide: btn_home
      - if:
          condition:
            lambda: return vigil::show_away();
          then:
            - lvgl.widget.show: btn_away
          else:
            - lvgl.widget.hide: btn_away
      - if:
          condition:
            lambda: return vigil::show_night();
          then:
            - lvgl.widget.show: btn_night
          else:
            - lvgl.widget.hide: btn_night
      - if:
          condition:
            lambda: return vigil::show_disarm();
          then:
            - lvgl.widget.show: btn_disarm
          else:
            - lvgl.widget.hide: btn_disarm

  # The texts that do not change with the alarm: they change with the language.
  - id: refresh_texts
    then:
      - lvgl.label.update:
          id: lbl_btn_home
          text: !lambda 'return vigil::tr("home");'
      - lvgl.label.update:
          id: lbl_btn_away
          text: !lambda 'return vigil::tr("away");'
      - lvgl.label.update:
          id: lbl_btn_night
          text: !lambda 'return vigil::tr("night");'
      - lvgl.label.update:
          id: lbl_btn_disarm
          text: !lambda 'return vigil::tr("disarm");'
      - lvgl.label.update:
          id: lbl_sens_title
          text: !lambda 'return vigil::tr("sensors");'
      - lvgl.label.update:
          id: lbl_info_title
          text: !lambda 'return vigil::tr("info");'
      - lvgl.label.update:
          id: lbl_info_conn
          text: !lambda 'return vigil::ctx.ha_connected ? vigil::tr("connected") : vigil::tr("not_connected");'
      - lvgl.label.update:
          id: lbl_info_ip
          text: !lambda 'return std::string("IP: ") + id(wifi_ip).state;'
      - lvgl.label.update:
          id: lbl_info_wifi
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f dBm", id(wifi_rssi).state);
            return vigil::tr("signal") + buf;
      - lvgl.label.update:
          id: lbl_info_up
          text: !lambda |-
            return vigil::tr("uptime") + std::to_string((int) (id(uptime_s).state / 60)) + vigil::tr("minutes");
      - lvgl.label.update:
          id: lbl_info_fw
          text: !lambda 'return vigil::tr("firmware") + "${firmware_version}";'
      - lvgl.label.update:
          id: lbl_info_id
          text: !lambda 'return vigil::tr("panel_id") + "${name}";'
      - lvgl.label.update:
          id: lbl_info_profile
          text: !lambda 'return vigil::tr("profile") + std::to_string(vigil::ctx.profile_version);'
      - script.execute: refresh_ui
      - script.execute: refresh_sensors

  # The sensors page.
  - id: refresh_sensors
    then:
      - lambda: |-
          int last = vigil::page_count() - 1;
          if (id(sens_page) > last) id(sens_page) = last;
      - lvgl.label.update:
          id: lbl_pager
          text: !lambda |-
            if (vigil::sensor_count() == 0) return vigil::tr("no_sensors");
            return std::to_string(id(sens_page) + 1) + " / " + std::to_string(vigil::page_count());
      - script.execute: row_update_0
      - script.execute: row_update_1
      - script.execute: row_update_2
      - script.execute: row_update_3
      - script.execute: row_update_4
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 0}}
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 1}}
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 2}}
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 3}}
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 4}}

  - id: sensors_page_step
    parameters:
      step: int
    then:
      - lambda: |-
          int page = id(sens_page) + step;
          int last = vigil::page_count() - 1;
          id(sens_page) = page < 0 ? 0 : (page > last ? last : page);
      - script.execute: refresh_sensors

  # A tap on the button of a sensor: bypass it, or restore it if it was bypassed.
  - id: tap_row
    parameters:
      slot: int
    then:
      - lambda: |-
          auto row = vigil::row_at(id(sens_page), slot);
          id(pending_entity) = row.entity;
          id(pending_name) = row.name;
          id(pending_action) = vigil::is_bypassed(row.status) ? vigil::UNBYPASS : vigil::BYPASS;
      - script.execute: start_action

  # The Sensors button: straight to the list, or first the installer code, depending on the
  # profile (`sensor_list`).
  - id: open_sensors
    then:
      - if:
          condition:
            lambda: return vigil::sensors_visible();
          then:
            - script.execute: show_sensors
          else:
            - lambda: |-
                id(pending_entity) = "";
                id(pending_name) = "";
                id(pending_action) = vigil::UNLOCK;
            - script.execute: start_action

  # The gear: the info page, always behind the installer code.
  - id: open_info
    then:
      - if:
          condition:
            lambda: return vigil::ctx.installer_unlocked && vigil::unlocked_now();
          then:
            - script.execute: show_info
          else:
            - lambda: |-
                id(pending_entity) = "";
                id(pending_name) = "";
                id(pending_action) = vigil::INFO;
            - script.execute: start_action

  - id: show_info
    then:
      - lambda: id(on_info_page) = true;
      - script.execute: refresh_texts
      - lvgl.page.show: page_info

  - id: show_sensors
    then:
      - lambda: id(on_sensors_page) = true;
      - script.execute: refresh_sensors
      - lvgl.page.show: page_sensors

  # Forget the unlock and close the list or the info, now or when the time is up.
  - id: lock_sensors
    then:
      - lambda: |-
          vigil::ctx.sensors_unlocked = false;
          vigil::ctx.installer_unlocked = false;
      - if:
          condition:
            lambda: return id(on_sensors_page) || id(on_info_page);
          then:
            - lambda: |-
                id(on_sensors_page) = false;
                id(on_info_page) = false;
            - lvgl.page.show: page_main
      - script.execute: refresh_ui

  - id: unlock_timer
    mode: restart
    then:
      - delay: !lambda 'return id(unlock_ms);'
      - script.execute: lock_sensors

  # Shows a message on the main page for a moment, for example that no installer code is set.
  - id: show_message
    parameters:
      message: string
    then:
      - lambda: vigil::ctx.message = message;
      - script.execute: refresh_ui
      - script.execute: clear_message

  # An action was chosen: ask for the code if that is needed, otherwise do it straight away.
  - id: start_action
    then:
      # The info opens with the installer code of this panel; without one set in Vigil there is nothing to ask for,
      # and it does not open. The list of sensors opens with the code of any user.
      - if:
          condition:
            lambda: return vigil::is_admin_action(id(pending_action)) && !vigil::ctx.has_admin_code;
          then:
            - lambda: id(pending_action) = 0;
            - script.execute:
                id: show_message
                message: !lambda 'return vigil::tr("no_admin_code");'
            - script.stop: start_action
      - if:
          condition:
            lambda: return vigil::needs_code(id(pending_action));
          then:
            - script.execute: open_keypad
          else:
            - script.execute: run_action

  - id: open_keypad
    then:
      - lambda: |-
          id(keypad_open) = true;
          id(on_sensors_page) = false;
          id(on_info_page) = false;
          // Stars only, and never the digit itself, not even for a moment.
          lv_textarea_set_password_show_time(id(pin_text), 0);
          lv_textarea_set_password_bullet(id(pin_text), "*");
      - lvgl.label.update:
          id: lbl_kp_title
          text: !lambda 'return vigil::keypad_title(id(pending_action), id(pending_name));'
      # Under the code: which code is expected, in grey; an error replaces it, in red.
      - lambda: lv_obj_set_style_text_color(id(lbl_kp_err), lv_color_hex(0x94A3B8), 0);
      - lvgl.label.update:
          id: lbl_kp_err
          text: !lambda 'return vigil::keypad_hint(id(pending_action));'
      - lvgl.textarea.update:
          id: pin_text
          text: ""
      - lvgl.page.show: page_keypad

  - id: close_keypad
    then:
      - lambda: |-
          id(keypad_open) = false;
          id(pending_action) = 0;
          id(on_sensors_page) = false;
          id(on_info_page) = false;
      - lvgl.textarea.update:
          id: pin_text
          text: ""
      - lvgl.page.show: page_main

  # The keypad closes when what it was for is over. It never opens by itself.
  - id: route
    then:
      - if:
          condition:
            lambda: return vigil::keypad_route(id(keypad_open), id(pending_action)) == 2;
          then:
            - script.execute: close_keypad

  - id: add_digit
    mode: parallel
    parameters:
      d: string
    then:
      - lambda: lv_textarea_add_text(id(pin_text), d.c_str());

  - id: delete_digit
    then:
      - lambda: lv_textarea_delete_char(id(pin_text));

  # Do the action. The result decides what the screen does next.
  - id: run_action
    then:
      - if:
          condition:
            lambda: return id(pending_action) >= vigil::ARM_HOME && id(pending_action) <= vigil::ARM_NIGHT;
          then:
            - homeassistant.action:
                action: vigil_alarm.arm
                data:
                  mode: !lambda |-
                    return id(pending_action) == vigil::ARM_HOME ? "home" : (id(pending_action) == vigil::ARM_AWAY ? "away" : "night");
                  source: ${name}
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'
      - if:
          condition:
            lambda: return id(pending_action) == vigil::DISARM;
          then:
            - homeassistant.action:
                action: vigil_alarm.disarm
                data:
                  source: ${name}
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'
      - if:
          condition:
            lambda: return vigil::is_unlock_action(id(pending_action));
          then:
            - homeassistant.action:
                action: vigil_alarm.unlock_panel
                data:
                  source: ${name}
                  scope: !lambda 'return id(pending_action) == vigil::INFO ? "info" : "sensors";'
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'
      - if:
          condition:
            lambda: return id(pending_action) == vigil::BYPASS;
          then:
            - homeassistant.action:
                action: vigil_alarm.bypass
                data:
                  sensor: !lambda 'return id(pending_entity);'
                  source: ${name}
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'
      - if:
          condition:
            lambda: return id(pending_action) == vigil::UNBYPASS;
          then:
            - homeassistant.action:
                action: vigil_alarm.unbypass
                data:
                  sensor: !lambda 'return id(pending_entity);'
                  source: ${name}
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'

  - id: action_done
    then:
      - lambda: vigil::ctx.message = "";
      # The installer code was right: Vigil has unlocked this panel. Show the list or the info until the time is up.
      - if:
          condition:
            lambda: return vigil::is_unlock_action(id(pending_action));
          then:
            - lambda: |-
                bool info = id(pending_action) == vigil::INFO;
                vigil::ctx.sensors_unlocked = true;
                vigil::ctx.installer_unlocked = info;
                id(keypad_open) = false;
                id(pending_action) = 0;
                id(on_info_page) = info;
                id(on_sensors_page) = !info;
            - lvgl.textarea.update:
                id: pin_text
                text: ""
            - script.execute: unlock_timer
            - if:
                condition:
                  lambda: return id(on_info_page);
                then:
                  - script.execute: show_info
                else:
                  - script.execute: show_sensors
      - if:
          condition:
            lambda: return id(pending_action) == vigil::BYPASS || id(pending_action) == vigil::UNBYPASS;
          then:
            - lambda: |-
                id(keypad_open) = false;
                id(pending_action) = 0;
                id(on_sensors_page) = true;
            - lvgl.textarea.update:
                id: pin_text
                text: ""
            - lvgl.page.show: page_sensors
          else:
            - if:
                condition:
                  lambda: return id(pending_action) != 0;
                then:
                  - script.execute: close_keypad
      - script.execute: refresh_ui

  # The error is shown on the keypad, or on the main page if there was no keypad.
  - id: action_failed
    parameters:
      message: string
    then:
      - lambda: vigil::ctx.message = vigil::localize_error(message);
      - lvgl.textarea.update:
          id: pin_text
          text: ""
      - if:
          condition:
            lambda: return id(keypad_open);
          then:
            - lambda: lv_obj_set_style_text_color(id(lbl_kp_err), lv_color_hex(0xF87171), 0);
            - lvgl.label.update:
                id: lbl_kp_err
                text: !lambda 'return vigil::ctx.message;'
          else:
            - lvgl.page.show: page_main
      - script.execute: refresh_ui
      - script.execute: clear_message

  - id: clear_message
    mode: restart
    then:
      - delay: 8s
      - lambda: |-
          vigil::ctx.message = "";
          lv_obj_set_style_text_color(id(lbl_kp_err), lv_color_hex(0x94A3B8), 0);
      - lvgl.label.update:
          id: lbl_kp_err
          text: !lambda 'return id(keypad_open) ? vigil::keypad_hint(id(pending_action)) : std::string("");'
      - script.execute: refresh_ui

# --------------------------------------------------------------------------------------- screen
lvgl:
  default_font: montserrat_20
  text_color: 0xE6EAF0
  bg_color: 0x0B0F14
  # A see-through layer over everything, there while the screen is dark: it takes the touch that wakes the panel.
  top_layer:
    widgets:
      - obj:
          id: wake_shield
          width: 100%
          height: 100%
          align: CENTER
          bg_opa: TRANSP
          border_width: 0
          radius: 0
          shadow_width: 0
          scrollable: false
          hidden: true
          clickable: true
          on_release:
            - lvgl.widget.hide: wake_shield
  pages:
    # ================================================================== MAIN
    - id: page_main
      bg_color: 0x0B0F14
      scrollable: false
      widgets:
        - label:
            id: lbl_time
            text: "--:--"
            text_font: montserrat_28
            text_color: 0xAAB4C3
            align: TOP_LEFT
            x: 20
            y: 16
        - label:
            id: lbl_conn
            text: "HA ?"
            text_font: montserrat_14
            text_color: 0x64748B
            align: TOP_LEFT
            x: 120
            y: 24
        - button:
            id: btn_settings
            width: 52
            height: 52
            align: TOP_RIGHT
            x: -14
            y: 8
            radius: 26
            bg_color: 0x1C2430
            shadow_width: 0
            on_click:
              then:
                - script.execute: open_info
            widgets:
              - label:
                  text: ""
                  text_color: 0xAAB4C3
                  align: CENTER
        # The state
        - obj:
            id: card_state
            width: ${content_w}
            height: 210
            align: TOP_MID
            y: 70
            radius: 28
            bg_color: 0x475569
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: lbl_state
                  text: ""
                  text_font: montserrat_40
                  text_color: 0xFFFFFF
                  align: TOP_MID
                  y: 36
              - label:
                  id: lbl_sub
                  text: ""
                  text_font: montserrat_20
                  text_color: 0xF1F5F9
                  text_align: CENTER
                  long_mode: WRAP
                  width: 420
                  align: BOTTOM_MID
                  y: -22
        # The buttons: only the modes that are on, or Disarm
        - obj:
            id: row_modes
            width: ${content_w}
            height: 96
            align: TOP_MID
            y: 296
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: ROW
              pad_column: 12
            widgets:
              - button:
                  id: btn_home
                  height: 96
                  flex_grow: 1
                  radius: 22
                  bg_color: 0x0D9488
                  shadow_width: 0
                  on_click:
                    then:
                      - lambda: |-
                          id(pending_action) = vigil::ARM_HOME;
                          id(pending_entity) = "";
                      - script.execute: start_action
                  widgets:
                    - label:
                        id: lbl_btn_home
                        text: "Home"
                        text_font: montserrat_28
                        text_color: 0xFFFFFF
                        align: CENTER
              - button:
                  id: btn_away
                  height: 96
                  flex_grow: 1
                  radius: 22
                  bg_color: 0x2563EB
                  shadow_width: 0
                  on_click:
                    then:
                      - lambda: |-
                          id(pending_action) = vigil::ARM_AWAY;
                          id(pending_entity) = "";
                      - script.execute: start_action
                  widgets:
                    - label:
                        id: lbl_btn_away
                        text: "Away"
                        text_font: montserrat_28
                        text_color: 0xFFFFFF
                        align: CENTER
              - button:
                  id: btn_night
                  height: 96
                  flex_grow: 1
                  radius: 22
                  bg_color: 0x7C3AED
                  shadow_width: 0
                  on_click:
                    then:
                      - lambda: |-
                          id(pending_action) = vigil::ARM_NIGHT;
                          id(pending_entity) = "";
                      - script.execute: start_action
                  widgets:
                    - label:
                        id: lbl_btn_night
                        text: "Night"
                        text_font: montserrat_28
                        text_color: 0xFFFFFF
                        align: CENTER
              - button:
                  id: btn_disarm
                  height: 96
                  flex_grow: 1
                  radius: 22
                  bg_color: 0x1C2430
                  border_width: 2
                  border_color: 0x475569
                  shadow_width: 0
                  on_click:
                    then:
                      - lambda: |-
                          id(pending_action) = vigil::DISARM;
                          id(pending_entity) = "";
                      - script.execute: start_action
                  widgets:
                    - label:
                        id: lbl_btn_disarm
                        text: "Disarm"
                        text_font: montserrat_28
                        text_color: 0xFFFFFF
                        align: CENTER
        - button:
            id: btn_sensors
            width: ${content_w}
            height: 64
            align: TOP_MID
            y: 404
            radius: 22
            bg_color: 0x141A22
            shadow_width: 0
            on_click:
              then:
                - script.execute: open_sensors
            widgets:
              - label:
                  id: lbl_sensors_btn
                  text: "Sensors"
                  text_color: 0xE6EAF0
                  align: CENTER

    # ================================================================ KEYPAD
    - id: page_keypad
      bg_color: 0x0B0F14
      scrollable: false
      widgets:
        - button:
            id: btn_kp_cancel
            width: 52
            height: 52
            align: TOP_LEFT
            x: 14
            y: 8
            radius: 26
            bg_color: 0x1C2430
            shadow_width: 0
            on_click:
              then:
                - script.execute: close_keypad
            widgets:
              - label:
                  text: ""
                  align: CENTER
        - label:
            id: lbl_kp_title
            text: ""
            text_font: montserrat_28
            long_mode: DOT
            width: 360
            text_align: CENTER
            align: TOP_MID
            y: 16
        - textarea:
            id: pin_text
            width: 300
            height: 64
            align: TOP_MID
            y: 72
            one_line: true
            password_mode: true
            max_length: 12
            text_font: montserrat_40
            text_color: 0xFFFFFF  # without this the stars are dark grey on a dark background
            text_align: CENTER
            bg_color: 0x141A22
            border_width: 0
            radius: 18
            placeholder_text: ""
        - label:
            id: lbl_kp_err
            text: ""
            text_font: montserrat_14
            text_color: 0xF87171
            text_align: CENTER
            long_mode: WRAP
            width: 440
            align: TOP_MID
            y: 146
        - buttonmatrix:
            id: keypad
            width: ${content_w}
            height: 276
            align: TOP_MID
            y: 196
            pad_all: 0
            pad_row: 10
            pad_column: 10
            bg_opa: TRANSP
            border_width: 0
            text_font: montserrat_40
            items:
              bg_color: 0x1C2430
              radius: 18
              shadow_width: 0
              text_color: 0xFFFFFF
            rows:
              - buttons:
                  - text: "1"
                    on_press: {then: [{script.execute: {id: add_digit, d: "1"}}]}
                  - text: "2"
                    on_press: {then: [{script.execute: {id: add_digit, d: "2"}}]}
                  - text: "3"
                    on_press: {then: [{script.execute: {id: add_digit, d: "3"}}]}
              - buttons:
                  - text: "4"
                    on_press: {then: [{script.execute: {id: add_digit, d: "4"}}]}
                  - text: "5"
                    on_press: {then: [{script.execute: {id: add_digit, d: "5"}}]}
                  - text: "6"
                    on_press: {then: [{script.execute: {id: add_digit, d: "6"}}]}
              - buttons:
                  - text: "7"
                    on_press: {then: [{script.execute: {id: add_digit, d: "7"}}]}
                  - text: "8"
                    on_press: {then: [{script.execute: {id: add_digit, d: "8"}}]}
                  - text: "9"
                    on_press: {then: [{script.execute: {id: add_digit, d: "9"}}]}
              - buttons:
                  - text: ""
                    on_press: {then: [{script.execute: delete_digit}]}
                  - text: "0"
                    on_press: {then: [{script.execute: {id: add_digit, d: "0"}}]}
                  - text: ""
                    on_press: {then: [{script.execute: run_action}]}

    # =============================================================== SENSORS
    - id: page_sensors
      bg_color: 0x0B0F14
      scrollable: false
      widgets:
        - button:
            id: btn_sens_back
            width: 52
            height: 52
            align: TOP_LEFT
            x: 14
            y: 8
            radius: 26
            bg_color: 0x1C2430
            shadow_width: 0
            on_click:
              then:
                - script.execute: lock_sensors  # forget the unlock when leaving the list
                - lvgl.page.show: page_main
            widgets:
              - label:
                  text: ""
                  align: CENTER
        - label:
            id: lbl_sens_title
            text: "Sensors"
            text_font: montserrat_28
            align: TOP_MID
            y: 16
        - !include {file: vigil-panel-row.yaml, vars: {n: 0, y: 70}}
        - !include {file: vigil-panel-row.yaml, vars: {n: 1, y: 138}}
        - !include {file: vigil-panel-row.yaml, vars: {n: 2, y: 206}}
        - !include {file: vigil-panel-row.yaml, vars: {n: 3, y: 274}}
        - !include {file: vigil-panel-row.yaml, vars: {n: 4, y: 342}}
        - button:
            id: btn_prev
            width: 110
            height: 48
            align: BOTTOM_LEFT
            x: 12
            y: -10
            radius: 16
            bg_color: 0x1C2430
            shadow_width: 0
            on_click:
              then:
                - script.execute:
                    id: sensors_page_step
                    step: -1
            widgets:
              - label:
                  text: ""
                  align: CENTER
        - label:
            id: lbl_pager
            text: ""
            text_color: 0x8A94A3
            align: BOTTOM_MID
            y: -22
        - button:
            id: btn_next
            width: 110
            height: 48
            align: BOTTOM_RIGHT
            x: -12
            y: -10
            radius: 16
            bg_color: 0x1C2430
            shadow_width: 0
            on_click:
              then:
                - script.execute:
                    id: sensors_page_step
                    step: 1
            widgets:
              - label:
                  text: ""
                  align: CENTER

    # ================================================================== INFO
    - id: page_info
      bg_color: 0x0B0F14
      scrollable: false
      widgets:
        - button:
            id: btn_info_back
            width: 52
            height: 52
            align: TOP_LEFT
            x: 14
            y: 8
            radius: 26
            bg_color: 0x1C2430
            shadow_width: 0
            on_click:
              then:
                - script.execute: lock_sensors  # forget the unlock when leaving the info
            widgets:
              - label:
                  text: ""
                  align: CENTER
        - label:
            id: lbl_info_title
            text: "Info"
            text_font: montserrat_28
            align: TOP_MID
            y: 16
        - obj:
            width: ${content_w}
            height: 320
            align: TOP_MID
            y: 84
            radius: 22
            bg_color: 0x141A22
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: lbl_info_conn
                  text: ""
                  text_color: 0xE6EAF0
                  align: TOP_LEFT
                  x: 18
                  y: 16
              - label:
                  id: lbl_info_ip
                  text: ""
                  text_color: 0x8A94A3
                  align: TOP_LEFT
                  x: 18
                  y: 60
              - label:
                  id: lbl_info_wifi
                  text: ""
                  text_color: 0x8A94A3
                  align: TOP_LEFT
                  x: 18
                  y: 100
              - label:
                  id: lbl_info_up
                  text: ""
                  text_color: 0x8A94A3
                  align: TOP_LEFT
                  x: 18
                  y: 140
              - label:
                  id: lbl_info_fw
                  text: ""
                  text_color: 0x8A94A3
                  align: TOP_LEFT
                  x: 18
                  y: 180
              - label:
                  id: lbl_info_id
                  text: ""
                  text_color: 0x8A94A3
                  long_mode: DOT
                  width: 420
                  align: TOP_LEFT
                  x: 18
                  y: 220
              - label:
                  id: lbl_info_profile
                  text: ""
                  text_color: 0x8A94A3
                  align: TOP_LEFT
                  x: 18
                  y: 260
