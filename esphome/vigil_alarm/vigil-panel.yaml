          align: BOTTOM_MID
          bg_color: 0x0E1116
          bg_opa: COVER
          border_width: 1
          border_side: TOP
          border_color: 0x232A35
          radius: 0
          shadow_width: 0
          pad_all: 0
          scrollable: false
          layout:
            type: flex
            flex_flow: ROW
          widgets:
            - button:
                id: nav_alarm
