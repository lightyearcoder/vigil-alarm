# Vigil Alarm touch panel: the screen, for any ESPHome device with an LVGL display and a touch screen.
#
# This file is the part that is the same for every panel. The hardware (display, touch, backlight)
# is in a second file, for example guition-4848.yaml, and the device itself (name, Wi-Fi, keys) in
# a third, see ../example-garage.yaml. What the hardware file must provide:
#   - the substitutions `hardware_id`, `screen_width` and `screen_height`
#   - a light with the id `display_backlight`
#   - an `lvgl:` with the `touchscreens:` (and the display) of the panel
#   - the touch screen calls `script.execute: wake` when touched (the touch that wakes a dark
#     screen is then not passed on to the button under the finger)
#
# Nothing about what the panel may do is set here. The panel is added in Vigil (Panels), with the
# ESPHome device name as panel id, and reads its profile from the sensor Vigil makes for it: which
# modes there are, whether it may disarm or bypass, whether it may show the sensors, the language.
# The device name is also the source shown in the history: "Anna (vigil-panel-garage)". The `panel_key` (see
# below) proves that a call comes from this device; the name alone is only text.

substitutions:
  # The profile sensor Vigil makes for this panel: the panel id (the device name) with underscores.
  profile_entity: sensor.${ name | replace("-", "_") }_profile
  # How long the screen stays on without touch, until Vigil has told the panel (setting "Screen off after" in Vigil).
  backlight_timeout_seconds: "30"
  # The key of this panel, sent with every call so Vigil knows the call really comes from this device (the panel
  # key made under Panels in Vigil). Set it in your device file, from secrets.yaml. Empty: no key is sent.
  panel_key: ""
  # The version of this firmware, reported to Vigil.
  firmware_version: "0.6.10"
  # The width of the cards and buttons: the screen minus a margin on both sides.
  content_w: ${ screen_width | int - 24 }
  # The sizes follow the screen: the ring is a bit over a quarter of the shortest side, the keys fill the keypad.
  ring_d: ${ ([screen_width | int, screen_height | int] | min * 27 / 100) | int }
  ring_disc: ${ ([screen_width | int, screen_height | int] | min * 27 / 100) | int - 36 }
  # The ring and its disc are drawn at 90% inside the box of the full size, with the bottom on the same place.
  ring_d90: ${ ([screen_width | int, screen_height | int] | min * 27 * 9 / 1000) | int }
  ring_disc90: ${ (([screen_width | int, screen_height | int] | min * 27 / 100 - 36) * 9 / 10) | int }
  ring_gap: ${ (([screen_width | int, screen_height | int] | min * 27 / 100 - [screen_width | int, screen_height | int] | min * 27 * 9 / 1000) / 2) | int }
  disc_gap: ${ (([screen_width | int, screen_height | int] | min * 27 * 9 / 1000 - ([screen_width | int, screen_height | int] | min * 27 / 100 - 36) * 9 / 10) / 2) | int }
  nav_h: "60"
  mode_h: "88"
  keypad_h: ${ screen_height | int - 170 }
  key_w: ${ ((screen_width | int - 44) / 3) | int }
  key_h: ${ ((screen_height | int - 170 - 30) / 4) | int }

esphome:
  includes:
    - vigil_panel.h
    - vigil_logo.h
  # The logo in the top bar is an LVGL image made in the lambda of `refresh_ui`: the image widget has to be built into LVGL.
  build_flags:
    - -DLV_USE_IMAGE=1
  on_boot:
    priority: -100
    then:
      - lambda: |-
          vigil::ctx.device_name = "${name}";
      - script.execute: refresh_texts
      - script.execute: refresh_ui
      - script.execute: wake

font:
  # The icons: Material Design Icons, only the glyphs the panel uses (see VIGIL_ICON_* in vigil_panel.h). ESPHome
  # downloads the font file when you compile. The text is the built-in Montserrat of LVGL.
  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: font_icons_30
    size: 30
    bpp: 4
    glyphs: &icon_glyphs
      - "\U000F0CC8"
      - "\U000F0ECD"
      - "\U000F099D"
      - "\U000F0CCB"
      - "\U000F06A1"
      - "\U000F0A48"
      - "\U000F0594"
      - "\U000F001D"
      - "\U000F062E"
      - "\U000F0FC7"
      - "\U000F0341"
      - "\U000F11D9"
      - "\U000F02FD"
      - "\U000F05A9"
      - "\U000F05AA"
      - "\U000F0B5C"
      - "\U000F012C"
      - "\U000F0156"
      - "\U000F0141"
      - "\U000F0142"
      - "\U000F009F"
      - "\U000F051F"
      - "\U000F0338"
      - "\U000F073A"
      - "\U000F002A"
      - "\U000F099C"
  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: font_icons_22
    size: 22
    bpp: 4
    glyphs: *icon_glyphs
  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: font_icons_60
    size: 60
    bpp: 4
    glyphs: *icon_glyphs

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: pending_action  # what the keypad is for, see Action in vigil_panel.h
    type: int
    initial_value: "0"
  - id: pending_entity  # the sensor for a bypass
    type: std::string
  - id: pending_name
    type: std::string
  - id: keypad_open
    type: bool
    initial_value: "false"
  - id: on_sensors_page  # is the list of sensors on the screen?
    type: bool
    initial_value: "false"
  - id: on_info_page  # is the info page on the screen?
    type: bool
    initial_value: "false"
  - id: screen_off_ms  # how long the screen stays on without touch, from Vigil
    type: int
    initial_value: "${backlight_timeout_seconds} * 1000"
  - id: unlock_ms  # how long the list and the info stay open after the installer code, from the profile
    type: int
    initial_value: "60000"
  - id: sens_page  # the page of the sensors list, from 0
    type: int
    initial_value: "0"
  - id: logo_made  # has the logo been put in the top bar?
    type: bool
    initial_value: "false"

# ----------------------------------------------------------------- what Home Assistant tells us
text_sensor:
  # ---- the profile of this panel (a sensor Vigil makes; its state is the version of the profile)
  - platform: homeassistant
    id: ha_profile
    entity_id: ${profile_entity}
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.profile_version = vigil::to_int(x, 0);
        - script.execute: refresh_texts
  - platform: homeassistant
    id: ha_profile_language
    entity_id: ${profile_entity}
    attribute: language
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.lang = vigil::parse_language(x);
        - script.execute: refresh_texts
  - platform: homeassistant
    id: ha_profile_blocked
    entity_id: ${profile_entity}
    attribute: blocked
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.blocked = vigil::truthy(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_modes
    entity_id: ${profile_entity}
    attribute: modes_mask
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.modes_mask = vigil::to_int(x, 0);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_can_disarm
    entity_id: ${profile_entity}
    attribute: can_disarm
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.can_disarm = vigil::truthy(x);
        - script.execute: refresh_ui
        - script.execute: route
  - platform: homeassistant
    id: ha_profile_can_bypass
    entity_id: ${profile_entity}
    attribute: can_bypass
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.can_bypass = vigil::truthy(x);
        - script.execute: refresh_sensors
  - platform: homeassistant
    id: ha_profile_sensor_list
    entity_id: ${profile_entity}
    attribute: sensor_list
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.sensor_list = vigil::parse_sensor_list(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_unlock_seconds
    entity_id: ${profile_entity}
    attribute: unlock_seconds
    internal: true
    on_value:
      then:
        - lambda: id(unlock_ms) = vigil::to_int(x, 60) * 1000;
  - platform: homeassistant
    id: ha_profile_screen_off_seconds
    entity_id: ${profile_entity}
    attribute: screen_off_seconds
    internal: true
    on_value:
      then:
        - lambda: |-
            int seconds = vigil::to_int(x, 30);
            id(screen_off_ms) = (seconds < 5 ? 5 : seconds) * 1000;
  - platform: homeassistant
    id: ha_profile_screen_off_on_alarm
    entity_id: ${profile_entity}
    attribute: screen_off_on_alarm
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.screen_off_on_alarm = vigil::truthy(x);
  - platform: homeassistant
    id: ha_profile_code_arm_required
    entity_id: ${profile_entity}
    attribute: code_arm_required
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.code_arm_required = vigil::truthy(x);
  - platform: homeassistant
    id: ha_profile_has_admin_code
    entity_id: ${profile_entity}
    attribute: has_admin_code
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.has_admin_code = vigil::truthy(x);
  - platform: homeassistant
    id: ha_profile_unlocked
    entity_id: ${profile_entity}
    attribute: unlocked
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.profile_unlocked = vigil::truthy(x);
        - if:
            condition:
              lambda: return !vigil::ctx.profile_unlocked;
            then:
              - script.execute: lock_sensors
            else:
              - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_open_total
    entity_id: ${profile_entity}
    attribute: open_count
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.open_total = vigil::to_int(x, 0);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_faults_total
    entity_id: ${profile_entity}
    attribute: faults_count
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.faults_total = vigil::to_int(x, 0);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_problems
    entity_id: ${profile_entity}
    attribute: problems_count
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.problems = vigil::to_int(x, 0);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_open_now
    entity_id: ${profile_entity}
    attribute: open_now_text
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.open_now = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_bypassed
    entity_id: ${profile_entity}
    attribute: bypassed_text
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.bypassed = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_last_alarm
    entity_id: ${profile_entity}
    attribute: last_alarm_text
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.last_alarm = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_open_mode
    entity_id: ${profile_entity}
    attribute: open_sensors_text
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.open_mode = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_faults
    entity_id: ${profile_entity}
    attribute: faults_text
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.faults = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_profile_sensors
    entity_id: ${profile_entity}
    attribute: sensors
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.sensors = vigil::clean(x);
        - script.execute: refresh_ui
        - script.execute: refresh_sensors
  # The always-on sensors (fire, gas, water ...) belong to no partition: a list of their own, a choice next to the partitions
  - platform: homeassistant
    id: ha_profile_sensors_always
    entity_id: ${profile_entity}
    attribute: sensors_always
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.sensors_always = vigil::clean(x);
        - script.execute: refresh_ui
        - script.execute: refresh_sensors
  # ---- the partitions this panel may use, and the one on the screen
  - platform: homeassistant
    id: ha_partition_list
    entity_id: ${profile_entity}
    attribute: partition_list
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.partition_list = vigil::clean(x);
        - script.execute: refresh_parts
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_partition_selected
    entity_id: ${profile_entity}
    attribute: selected_partition
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.sel = vigil::clean(x);
        - script.execute: refresh_parts
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_partition_default
    entity_id: ${profile_entity}
    attribute: default_partition
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.default_part = vigil::clean(x);
  - platform: homeassistant
    id: ha_partition_return
    entity_id: ${profile_entity}
    attribute: partition_return_seconds
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.return_seconds = vigil::to_int(x, 0);
  - platform: homeassistant
    id: ha_partition_total
    entity_id: ${profile_entity}
    attribute: partition_total
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.part_total = vigil::to_int(x, 1);
        - script.execute: refresh_parts
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_view_mixed
    entity_id: ${profile_entity}
    attribute: view_mixed
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.mixed = vigil::truthy(x);
        - script.execute: refresh_ui
  # ---- the alarm itself: of the partition on the screen, or of all of them together. Vigil puts it in the profile
  # (view_*), so the panel needs no alarm entity per partition and follows the choice made on the screen.
  - platform: homeassistant
    id: ha_state
    entity_id: ${profile_entity}
    attribute: view_state
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.state = x;
        - script.execute: wake_event
        - script.execute: refresh_ui
        - script.execute: route
  - platform: homeassistant
    id: ha_mode
    entity_id: ${profile_entity}
    attribute: view_mode
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.mode = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_delay_left
    entity_id: ${profile_entity}
    attribute: view_delay_left
    internal: true
    on_value:
      then:
        # Seconds left, counted from the clock of this panel: a clock that is off does not matter.
        - lambda: |-
            auto t = id(ha_time).now();
            double left = vigil::parse_number(x);
            vigil::ctx.delay_end = (std::isnan(left) || !t.is_valid()) ? NAN : (double) t.timestamp + left;
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_changed_by
    entity_id: ${profile_entity}
    attribute: view_changed_by
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.changed_by = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_changed_via
    entity_id: ${profile_entity}
    attribute: view_changed_via
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.changed_via = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_cause
    entity_id: ${profile_entity}
    attribute: view_cause
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.cause = vigil::clean(x);
        - script.execute: refresh_ui
  - platform: homeassistant
    id: ha_cause_sensor
    entity_id: ${profile_entity}
    attribute: view_cause_sensor
    internal: true
    on_value:
      then:
        - lambda: vigil::ctx.cause_sensor = vigil::clean(x);
        - script.execute: refresh_ui
  # ---- what this panel tells Vigil about itself (Vigil reads these by name, see PanelRegistry)
  - platform: template
    name: Hardware ID
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return std::string("${hardware_id}");'
  - platform: template
    name: Capabilities
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return std::string("lvgl,touch,${screen_width}x${screen_height}");'
  - platform: template
    name: Firmware version
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return std::string("${firmware_version}");'
  - platform: template
    name: Profile version
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return std::to_string(vigil::PROFILE_VERSION);'
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true
      on_value:
        - script.execute: refresh_texts

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    internal: true
    update_interval: 10s
    on_value:
      - script.execute: refresh_texts
  - platform: uptime
    id: uptime_s
    internal: true
    update_interval: 30s
    on_value:
      - script.execute: refresh_texts

interval:
  # The clock, and the countdown of the exit or entry delay.
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          vigil::ctx.now = t.is_valid() ? (double) t.timestamp : NAN;
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            auto t = id(ha_time).now();
            return t.is_valid() ? t.strftime("%H:%M") : std::string("--:--");
      - if:
          condition:
            lambda: return vigil::ctx.state == "arming" || vigil::ctx.state == "pending";
          then:
            - script.execute: refresh_ui
  # A screen that can switch goes back to its own partition after a while without touch (the time is set in Vigil),
  # but not while the list of sensors is open: the list would change under the eyes of whoever reads it.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return vigil::should_return_to_default(lv_display_get_inactive_time(nullptr)) && !id(keypad_open) && !id(on_sensors_page);
          then:
            - script.execute:
                id: choose_part
                partition: !lambda 'return vigil::ctx.default_part;'
  # Is Home Assistant there? Only "connected" for Home Assistant itself, not for a log viewer.
  - interval: 5s
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - script.execute:
                id: set_connected
                up: true
          else:
            - script.execute:
                id: set_connected
                up: false

# ------------------------------------------------------------------------------------- scripts
script:
  # The screen on, and off again after a while without touch. As long as the screen is dark a see-through shield
  # lies over everything (see `top_layer` below), so the touch that wakes the panel does not also press the button
  # under the finger. The shield goes when that finger is lifted. `wake` and `wake_touch` are the same thing, so a
  # hardware file that still calls `wake` on touch works too.
  # The screen is on after a touch, or because the alarm changed. After the screen-off time without touch:
  #  1. a half typed code, the list or the info is still open? Back to the main page (visible), and wait once more;
  #  2. the alarm is counting down, or going off and Vigil says the screen must stay on? Then stay on. The state
  #     changing again starts this script again;
  #  3. otherwise the screen goes dark.
  - id: wake
    mode: restart
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - delay: !lambda 'return id(screen_off_ms);'
      - if:
          condition:
            lambda: return id(keypad_open) || id(on_sensors_page) || id(on_info_page);
          then:
            - script.execute: reset_ui
            - delay: !lambda 'return id(screen_off_ms);'
      - if:
          condition:
            lambda: return !vigil::screen_may_sleep();
          then:
            - script.stop: wake
      - light.turn_off: display_backlight
      - lvgl.widget.show: wake_shield
      # The backlight fades out (transition of the light, 1 s). Wait until it is really dark before touching the
      # screen again, so nobody sees it change.
      - delay: 1500ms
      - script.execute: reset_ui

  - id: reset_ui
    then:
      - lambda: |-
          vigil::ctx.force = false;
          id(keypad_open) = false;
          id(pending_action) = 0;
          id(sens_page) = 0;
          id(on_sensors_page) = false;
          id(on_info_page) = false;
          vigil::ctx.sensors_unlocked = false;  // the panel forgets the unlock
          vigil::ctx.installer_unlocked = false;
      - lvgl.textarea.update:
          id: pin_text
          text: ""
      - lvgl.page.show: page_main
      - script.execute: route
      - script.execute: nav_update

  - id: wake_touch
    then:
      - script.execute: wake

  # The screen on for another reason than a touch (the alarm changed, start-up): no shield, a touch counts at once.
  - id: wake_event
    then:
      - lvgl.widget.hide: wake_shield
      - script.execute: wake

  - id: set_connected
    parameters:
      up: bool
    then:
      - if:
          condition:
            lambda: return vigil::ctx.ha_connected != up;
          then:
            - lambda: vigil::ctx.ha_connected = up;
            - script.execute: refresh_ui
            - script.execute: refresh_texts

  # The main page: the ring, the texts, the buttons. One lambda, so the screen changes in one go.
  - id: refresh_ui
    mode: restart
    then:
      - lambda: |-
          using namespace vigil;
          auto hide = [](lv_obj_t *o, bool h) {
            if (h) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN); else lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          // The logo in the top bar: made once, the first time the screen is drawn.
          if (!id(logo_made)) {
            lv_obj_t *logo = lv_image_create(id(logo_box));
            lv_image_set_src(logo, logo_image());
            lv_obj_center(logo);
            id(logo_made) = true;
          }
          const uint32_t col = ring_color();
          const bool alarm = usable() && ctx.state == "triggered";
          lv_label_set_text(id(lbl_state), state_title().c_str());
          const std::string sub = state_sub(ctx.now);
          lv_label_set_text(id(lbl_sub), sub.c_str());
          // A short text is big, a long one (a few lines) is small, so it always fits in the card.
          const bool short_text = sub.size() <= 40 && std::count(sub.begin(), sub.end(), '\n') <= 1;
          lv_obj_set_style_text_font(id(lbl_sub), short_text ? &lv_font_montserrat_20 : &lv_font_montserrat_14, 0);
          // The ring: full in the colour of the state, or counting down during the exit and the entry delay.
          lv_arc_set_value(id(ring), ring_percent(ctx.now));
          lv_obj_set_style_arc_color(id(ring), lv_color_hex(col), LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(ring_disc), lv_color_hex(tint_of(col)), 0);
          std::string number = ring_text(ctx.now);
          lv_label_set_text(id(lbl_ring_icon), state_icon().c_str());
          lv_obj_set_style_text_color(id(lbl_ring_icon), lv_color_hex(col), 0);
          lv_label_set_text(id(lbl_ring_num), number.c_str());
          lv_obj_set_style_text_color(id(lbl_ring_num), lv_color_hex(col), 0);
          hide(id(lbl_ring_icon), !number.empty());
          hide(id(lbl_ring_num), number.empty());
          // Home Assistant there? The icon at the top right says so.
          lv_label_set_text(id(lbl_wifi), ctx.ha_connected ? VIGIL_ICON_WIFI : VIGIL_ICON_WIFI_OFF);
          lv_obj_set_style_text_color(id(lbl_wifi), lv_color_hex(ctx.ha_connected ? COL_OFF : COL_ALARM), 0);
          // The buttons: only what is allowed now. A row without buttons takes no room.
          hide(id(btn_home), !show_home());
          hide(id(btn_away), !show_away());
          hide(id(btn_night), !show_night());
          hide(id(btn_vacation), !show_vacation());
          hide(id(btn_custom), !show_custom());
          // Up to three buttons: the large text; more: smaller, so five fit in the row.
          const lv_font_t *mode_font = mode_count() > 3 ? &lv_font_montserrat_14 : &lv_font_montserrat_20;
          for (lv_obj_t *l : {id(lbl_btn_home), id(lbl_btn_away), id(lbl_btn_night), id(lbl_btn_vacation), id(lbl_btn_custom)})
            lv_obj_set_style_text_font(l, mode_font, 0);
          hide(id(btn_disarm), !show_disarm());
          hide(id(btn_force), !show_force());
          hide(id(row_modes), show_force() || mode_count() == 0);
          // Mode buttons and Disarm both there (partitions differ): the ring goes, so the text still fits in the card.
          hide(id(ring_box), show_disarm() && !(show_force() || mode_count() == 0));
          // The alarm: a red frame, and everything a little red
          hide(id(alarm_frame), !alarm);
          const uint32_t ground = alarm ? 0x1A0F12 : 0x0E1116;
          lv_obj_set_style_bg_color(id(page_main)->obj, lv_color_hex(ground), 0);
          lv_obj_set_style_bg_color(id(page_sensors)->obj, lv_color_hex(ground), 0);
          lv_obj_set_style_bg_color(id(page_info)->obj, lv_color_hex(ground), 0);
          lv_obj_set_style_bg_color(id(page_keypad)->obj, lv_color_hex(ground), 0);
          lv_obj_set_style_bg_color(id(nav), lv_color_hex(ground), 0);
          lv_obj_set_style_bg_color(id(card_ring), lv_color_hex(alarm ? 0x231216 : 0x151A22), 0);
          lv_obj_set_style_border_color(id(card_ring), lv_color_hex(alarm ? 0x5A2A30 : 0x232A35), 0);
      - script.execute: refresh_parts
      - script.execute: nav_update

  # The partitions at the top of the main page: one line with the name when the panel has one partition and the house
  # more; else a button for each partition the panel may use, and "All". The one on the screen has a coloured edge,
  # the panel's own (default) one says so while there are few buttons.
  - id: refresh_parts
    then:
      - lambda: |-
          using namespace vigil;
          auto hide = [](lv_obj_t *o, bool h) {
            if (h) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN); else lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          const bool show = usable() && parts_visible();
          const std::vector<PartRow> rows = part_rows(false);
          const bool switching = rows.size() > 1;
          sync_chip_page();
          const bool paged = show && switching && parts_paged();
          hide(id(chip_prev), !paged);
          hide(id(chip_next), !paged);
          if (paged) {
            // an arrow is dim when there is nothing further that way
            lv_obj_set_style_opa(id(chip_prev), chip_page_now() > 0 ? LV_OPA_COVER : LV_OPA_40, 0);
            lv_obj_set_style_opa(id(chip_next), chip_page_now() < part_pages() - 1 ? LV_OPA_COVER : LV_OPA_40, 0);
          }
          hide(id(row_parts), !show);
          hide(id(part_one), !(show && !switching));
          if (show && !switching) {
            lv_label_set_text(id(lbl_part_one), rows[0].name.c_str());
            lv_label_set_text(id(lbl_part_note), tr("only_this").c_str());
            lv_obj_set_style_bg_color(id(part_one_dot), lv_color_hex(color_of_state(rows[0].state)), 0);
          }
          lv_obj_t *chips[5] = {id(chip_0), id(chip_1), id(chip_2), id(chip_3), id(chip_all)};
          lv_obj_t *dots[5] = {id(chip_0_dot), id(chip_1_dot), id(chip_2_dot), id(chip_3_dot), id(chip_all_dot)};
          lv_obj_t *lbls[5] = {id(chip_0_lbl), id(chip_1_lbl), id(chip_2_lbl), id(chip_3_lbl), id(chip_all_lbl)};
          lv_obj_t *tags[5] = {id(chip_0_tag), id(chip_1_tag), id(chip_2_tag), id(chip_3_tag), id(chip_all_tag)};
          const std::vector<PartRow> all_rows = part_rows(true);
          int n = 0;
          for (int i = 0; i < 5; i++) if (!chip_target(i).empty()) n++;  // (the first loop of the buttons)
          const int arrows = paged ? 2 : 0;  // an arrow on each side takes 34 and a gap of 8
          const int fit = n > 0 ? (${content_w} - 8 * (n - 1 + arrows) - 34 * arrows) / n : 0;  // room for one button
          const int pad = paged ? 8 : 12;    // the buttons are a little tighter when there are arrows
          const lv_font_t *font = n <= 3 && !paged ? &lv_font_montserrat_20 : &lv_font_montserrat_14;
          const std::string sel = sel_id();
          for (int i = 0; i < 5; i++) {
            const std::string target = chip_target(i);
            hide(chips[i], !(show && switching) || target.empty());
            if (target.empty()) continue;
            std::string name = tr("all");
            std::string state = "disarmed";
            bool mixed = false;
            for (const PartRow &r : all_rows) {
              if (r.id != target) continue;
              if (target != "all") name = r.name;
              state = r.state;
              mixed = r.mixed;
            }
            const bool on = target == sel;
            lv_label_set_text(lbls[i], name.c_str());
            lv_obj_set_style_text_font(lbls[i], font, 0);
            // One line: as wide as the name, but never wider than what is left of the button (then it ends in dots).
            lv_point_t size;
            lv_text_get_size(&size, name.c_str(), font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
            lv_obj_set_style_pad_left(chips[i], pad, 0);
            lv_obj_set_style_pad_right(chips[i], pad, 0);
            const int room = std::max(fit - 2 * pad - 10 - 6, 16);
            lv_obj_set_width(lbls[i], std::min((int) size.x + 2, room));
            lv_obj_set_height(lbls[i], lv_font_get_line_height(font));
            lv_label_set_long_mode(lbls[i], LV_LABEL_LONG_DOT);
            lv_label_set_text(tags[i], "");
            hide(tags[i], true);
            lv_obj_set_style_bg_color(dots[i], lv_color_hex(mixed ? COL_WARN : color_of_state(state)), 0);
            lv_obj_set_style_border_color(chips[i], lv_color_hex(on ? COL_WARN : 0x232A35), 0);
            lv_obj_set_style_border_width(chips[i], on ? 2 : 1, 0);
            lv_obj_set_style_bg_color(chips[i], lv_color_hex(on ? 0x2A2410 : 0x151A22), 0);
          }

  # A button at the top: show that partition. Vigil is told, so the profile (the state, the sensors, the modes) follows;
  # the screen already shows the choice.
  - id: choose_part
    parameters:
      partition: string
    then:
      - if:
          condition:
            lambda: return partition == "always";
          then:
            # "Always on" is no partition: only the list changes, Vigil is not told and the main page stays as it is
            - lambda: |-
                vigil::ctx.sens_always = true;
                id(sens_page) = 0;
            - script.execute: refresh_sensors
      - if:
          condition:
            lambda: return !partition.empty() && partition != "always";
          then:
            - lambda: |-
                vigil::ctx.sens_always = false;
                vigil::ctx.sel = partition;
                vigil::ctx.page_sel = "";  // the buttons show the page of this partition again
                id(sens_page) = 0;
            - script.execute: refresh_ui
            - script.execute: refresh_sensors
            - homeassistant.action:
                action: vigil_alarm.select_partition
                data:
                  source: ${name}
                  key: ${panel_key}
                  partition: !lambda 'return partition;'

  # The tabs at the bottom: the active one has the colour of the state, the keypad has none, the sensors tab has the
  # number of open sensors, or is not there at all if the list is for nobody.
  - id: nav_update
    then:
      - lambda: |-
          using namespace vigil;
          auto hide = [](lv_obj_t *o, bool h) {
            if (h) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN); else lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          hide(id(nav), id(keypad_open));
          const int tab = id(on_info_page) ? 2 : (id(on_sensors_page) ? 1 : 0);
          const lv_color_t on = lv_color_hex(ring_color());
          const lv_color_t off = lv_color_hex(COL_OFF);
          lv_obj_set_style_text_color(id(nav_alarm_icon), tab == 0 ? on : off, 0);
          lv_obj_set_style_text_color(id(nav_alarm_lbl), tab == 0 ? on : off, 0);
          lv_obj_set_style_text_color(id(nav_sens_icon), tab == 1 ? on : off, 0);
          lv_obj_set_style_text_color(id(nav_sens_lbl), tab == 1 ? on : off, 0);
          lv_obj_set_style_text_color(id(nav_info_icon), tab == 2 ? on : off, 0);
          lv_obj_set_style_text_color(id(nav_info_lbl), tab == 2 ? on : off, 0);
          hide(id(nav_sens), !show_sensors_button());
          const int open = open_total_count();
          lv_label_set_text(id(nav_badge_lbl), std::to_string(open).c_str());
          hide(id(nav_badge), open <= 0);

  # The texts that do not change with the alarm: they change with the language.
  - id: refresh_texts
    then:
      - lvgl.label.update:
          id: lbl_btn_home
          text: !lambda 'return vigil::tr("home");'
      - lvgl.label.update:
          id: lbl_btn_away
          text: !lambda 'return vigil::tr("away");'
      - lvgl.label.update:
          id: lbl_btn_night
          text: !lambda 'return vigil::tr("night");'
      - lvgl.label.update:
          id: lbl_btn_vacation
          text: !lambda 'return vigil::tr("vacation");'
      - lvgl.label.update:
          id: lbl_btn_custom
          text: !lambda 'return vigil::tr("custom");'
      - lvgl.label.update:
          id: lbl_btn_disarm
          text: !lambda 'return vigil::tr("disarm");'
      - lvgl.label.update:
          id: lbl_btn_force
          text: !lambda 'return vigil::tr("force");'
      - lvgl.label.update:
          id: lbl_sens_title
          text: !lambda 'return vigil::tr("sensors");'
      - lvgl.label.update:
          id: nav_alarm_lbl
          text: !lambda 'return vigil::tr("nav_alarm");'
      - lvgl.label.update:
          id: nav_sens_lbl
          text: !lambda 'return vigil::tr("sensors");'
      - lvgl.label.update:
          id: nav_info_lbl
          text: !lambda 'return vigil::tr("nav_info");'
      - lvgl.label.update:
          id: lbl_info_title
          text: !lambda 'return vigil::tr("info");'
      - lvgl.label.update:
          id: lbl_info_conn
          text: !lambda 'return vigil::ctx.ha_connected ? vigil::tr("connected") : vigil::tr("not_connected");'
      - lvgl.label.update:
          id: lbl_info_ip
          text: !lambda 'return std::string("IP: ") + id(wifi_ip).state;'
      - lvgl.label.update:
          id: lbl_info_wifi
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f dBm", id(wifi_rssi).state);
            return vigil::tr("signal") + buf;
      - lvgl.label.update:
          id: lbl_info_up
          text: !lambda |-
            return vigil::tr("uptime") + std::to_string((int) (id(uptime_s).state / 60)) + vigil::tr("minutes");
      - lvgl.label.update:
          id: lbl_info_fw
          text: !lambda 'return vigil::tr("firmware") + "${firmware_version}";'
      - lvgl.label.update:
          id: lbl_info_id
          text: !lambda 'return vigil::tr("panel_id") + "${name}";'
      - lvgl.label.update:
          id: lbl_info_profile
          text: !lambda 'return vigil::tr("profile") + std::to_string(vigil::ctx.profile_version);'
      - lvgl.label.update:
          id: lbl_info_key
          text: !lambda 'return vigil::tr("panel_key") + (std::string("${panel_key}").empty() ? vigil::tr("key_not_set") : vigil::tr("key_set"));'
      - script.execute: refresh_ui
      - script.execute: refresh_sensors

  # The sensors page.
  - id: refresh_sensors
    then:
      - lambda: |-
          int last = vigil::page_count() - 1;
          if (id(sens_page) > last) id(sens_page) = last;
      - lvgl.label.update:
          id: lbl_sens_sub
          text: !lambda |-
            int open = vigil::open_total_count();
            return open > 0 ? vigil::tr("open") + std::to_string(open) : vigil::tr("all_closed");
      - lvgl.label.update:
          id: lbl_pager
          text: !lambda |-
            if (vigil::sensor_count() == 0) return vigil::tr("no_sensors");
            return std::to_string(id(sens_page) + 1) + " / " + std::to_string(vigil::page_count());
      - lambda: |-
          const bool show = vigil::usable() && vigil::parts_visible();
          if (show) lv_obj_remove_flag(id(sens_part), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(sens_part), LV_OBJ_FLAG_HIDDEN);
          if (show) lv_label_set_text(id(sens_part_lbl), vigil::sel_name().c_str());
          // with one partition there is nothing to step to: the name only, no button
          if (vigil::parts_switch()) lv_obj_add_flag(id(sens_part), LV_OBJ_FLAG_CLICKABLE);
          else lv_obj_remove_flag(id(sens_part), LV_OBJ_FLAG_CLICKABLE);
      - script.execute: row_update_0
      - script.execute: row_update_1
      - script.execute: row_update_2
      - script.execute: row_update_3
      - script.execute: row_update_4
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 0}}
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 1}}
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 2}}
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 3}}
  - !include {file: vigil-panel-row-script.yaml, vars: {n: 4}}

  - id: sensors_page_step
    parameters:
      step: int
    then:
      - lambda: |-
          int page = id(sens_page) + step;
          int last = vigil::page_count() - 1;
          id(sens_page) = page < 0 ? 0 : (page > last ? last : page);
      - script.execute: refresh_sensors

  # A tap on the button of a sensor: bypass it, or restore it if it was bypassed.
  - id: tap_row
    parameters:
      slot: int
    then:
      - lambda: |-
          auto row = vigil::row_at(id(sens_page), slot);
          id(pending_entity) = row.entity;
          id(pending_name) = row.name;
          id(pending_action) = vigil::is_bypassed(row.status) ? vigil::UNBYPASS : vigil::BYPASS;
      - script.execute: start_action

  # The Sensors button: straight to the list, or first the installer code, depending on the
  # profile (`sensor_list`).
  - id: open_sensors
    then:
      - lambda: vigil::ctx.sens_always = false;  // the list starts with the partition on screen
      - if:
          condition:
            lambda: return vigil::sensors_visible();
          then:
            - script.execute: show_sensors
          else:
            - lambda: |-
                id(pending_entity) = "";
                id(pending_name) = "";
                id(pending_action) = vigil::UNLOCK;
            - script.execute: start_action

  # The gear: the info page, always behind the installer code.
  - id: open_info
    then:
      - if:
          condition:
            lambda: return vigil::ctx.installer_unlocked && vigil::unlocked_now();
          then:
            - script.execute: show_info
          else:
            - lambda: |-
                id(pending_entity) = "";
                id(pending_name) = "";
                id(pending_action) = vigil::INFO;
            - script.execute: start_action

  - id: show_info
    then:
      - lambda: id(on_info_page) = true;
      - script.execute: refresh_texts
      - lvgl.page.show: page_info
      - script.execute: nav_update

  - id: show_sensors
    then:
      - lambda: id(on_sensors_page) = true;
      - script.execute: refresh_sensors
      - lvgl.page.show: page_sensors
      - script.execute: nav_update

  # Forget the unlock and close the list or the info, now or when the time is up.
  - id: lock_sensors
    then:
      - lambda: |-
          vigil::ctx.sensors_unlocked = false;
          vigil::ctx.installer_unlocked = false;
      - if:
          condition:
            lambda: return id(on_sensors_page) || id(on_info_page);
          then:
            - lambda: |-
                id(on_sensors_page) = false;
                id(on_info_page) = false;
            - lvgl.page.show: page_main
      - script.execute: refresh_ui

  - id: unlock_timer
    mode: restart
    then:
      - delay: !lambda 'return id(unlock_ms);'
      - script.execute: lock_sensors

  # Shows a message on the main page for a moment, for example that no installer code is set.
  - id: show_message
    parameters:
      message: string
    then:
      - lambda: vigil::ctx.message = message;
      - script.execute: refresh_ui
      - script.execute: clear_message

  # An action was chosen: ask for the code if that is needed, otherwise do it straight away.
  - id: start_action
    then:
      # The info opens with the installer code of this panel; without one set in Vigil there is nothing to ask for,
      # and it does not open. The list of sensors opens with the code of any user.
      - if:
          condition:
            lambda: return vigil::is_admin_action(id(pending_action)) && !vigil::ctx.has_admin_code;
          then:
            - lambda: id(pending_action) = 0;
            - script.execute:
                id: show_message
                message: !lambda 'return vigil::tr("no_admin_code");'
            - script.stop: start_action
      - if:
          condition:
            lambda: return vigil::needs_code(id(pending_action));
          then:
            - script.execute: open_keypad
          else:
            - script.execute: run_action

  - id: open_keypad
    then:
      - lambda: |-
          id(keypad_open) = true;
          id(on_sensors_page) = false;
          id(on_info_page) = false;
          // Stars only, and never the digit itself, not even for a moment.
          lv_textarea_set_password_show_time(id(pin_text), 0);
          lv_textarea_set_password_bullet(id(pin_text), "*");
      - lvgl.label.update:
          id: lbl_kp_title
          text: !lambda 'return vigil::keypad_title(id(pending_action), id(pending_name));'
      # Under the code: which code is expected, in grey; an error replaces it, in red.
      - lambda: lv_obj_set_style_text_color(id(lbl_kp_err), lv_color_hex(0x8A94A6), 0);
      - lvgl.label.update:
          id: lbl_kp_err
          text: !lambda 'return vigil::keypad_hint(id(pending_action));'
      - lvgl.textarea.update:
          id: pin_text
          text: ""
      - lvgl.page.show: page_keypad
      - script.execute: nav_update

  - id: close_keypad
    then:
      - lambda: |-
          vigil::ctx.force = false;
          id(keypad_open) = false;
          id(pending_action) = 0;
          id(on_sensors_page) = false;
          id(on_info_page) = false;
      - lvgl.textarea.update:
          id: pin_text
          text: ""
      - lvgl.page.show: page_main
      - script.execute: nav_update

  # The keypad closes when what it was for is over. It never opens by itself.
  - id: route
    then:
      - if:
          condition:
            lambda: return vigil::keypad_route(id(keypad_open), id(pending_action)) == 2;
          then:
            - script.execute: close_keypad

  - id: add_digit
    mode: parallel
    parameters:
      d: string
    then:
      - lambda: lv_textarea_add_text(id(pin_text), d.c_str());

  - id: delete_digit
    then:
      - lambda: lv_textarea_delete_char(id(pin_text));

  # Do the action. The result decides what the screen does next.
  - id: run_action
    then:
      - if:
          condition:
            lambda: return vigil::is_arm_action(id(pending_action));
          then:
            - homeassistant.action:
                action: vigil_alarm.arm
                data:
                  mode: !lambda |-
                    return std::string(vigil::arm_mode_name(id(pending_action)));
                  source: ${name}
                  key: ${panel_key}
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                  bypass_open: !lambda 'return std::string(vigil::ctx.force ? "true" : "false");'
                  partition: !lambda 'return vigil::sel_id();'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'
      - if:
          condition:
            lambda: return id(pending_action) == vigil::DISARM;
          then:
            - homeassistant.action:
                action: vigil_alarm.disarm
                data:
                  source: ${name}
                  key: ${panel_key}
                  partition: !lambda 'return vigil::sel_id();'
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'
      - if:
          condition:
            lambda: return vigil::is_unlock_action(id(pending_action));
          then:
            - homeassistant.action:
                action: vigil_alarm.unlock_panel
                data:
                  source: ${name}
                  key: ${panel_key}
                  scope: !lambda 'return id(pending_action) == vigil::INFO ? "info" : "sensors";'
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'
      - if:
          condition:
            lambda: return id(pending_action) == vigil::BYPASS;
          then:
            - homeassistant.action:
                action: vigil_alarm.bypass
                data:
                  sensor: !lambda 'return id(pending_entity);'
                  source: ${name}
                  key: ${panel_key}
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'
      - if:
          condition:
            lambda: return id(pending_action) == vigil::UNBYPASS;
          then:
            - homeassistant.action:
                action: vigil_alarm.unbypass
                data:
                  sensor: !lambda 'return id(pending_entity);'
                  source: ${name}
                  key: ${panel_key}
                  code: !lambda 'return std::string(lv_textarea_get_text(id(pin_text)));'
                on_success:
                  - script.execute: action_done
                on_error:
                  - script.execute:
                      id: action_failed
                      message: !lambda 'return error;'

  - id: action_done
    then:
      - lambda: |-
          vigil::ctx.message = "";
          vigil::ctx.force = false;
          vigil::ctx.refused_action = 0;
      # The installer code was right: Vigil has unlocked this panel. Show the list or the info until the time is up.
      - if:
          condition:
            lambda: return vigil::is_unlock_action(id(pending_action));
          then:
            - lambda: |-
                bool info = id(pending_action) == vigil::INFO;
                vigil::ctx.sensors_unlocked = true;
                vigil::ctx.installer_unlocked = info;
                id(keypad_open) = false;
                id(pending_action) = 0;
                id(on_info_page) = info;
                id(on_sensors_page) = !info;
            - lvgl.textarea.update:
                id: pin_text
                text: ""
            - script.execute: unlock_timer
            - if:
                condition:
                  lambda: return id(on_info_page);
                then:
                  - script.execute: show_info
                else:
                  - script.execute: show_sensors
      - if:
          condition:
            lambda: return id(pending_action) == vigil::BYPASS || id(pending_action) == vigil::UNBYPASS;
          then:
            - lambda: |-
                id(keypad_open) = false;
                id(pending_action) = 0;
                id(on_sensors_page) = true;
            - lvgl.textarea.update:
                id: pin_text
                text: ""
            - lvgl.page.show: page_sensors
          else:
            - if:
                condition:
                  lambda: return id(pending_action) != 0;
                then:
                  - script.execute: close_keypad
      - script.execute: refresh_ui

  # The error is shown on the keypad, or on the main page if there was no keypad.
  - id: action_failed
    parameters:
      message: string
    then:
      # Arming refused because something stops it (not a wrong code): say what, close the keypad, and offer
      # "Bypass and arm" in place of the tiles (not when that was just tried).
      - lambda: |-
          vigil::Refusal refusal = vigil::parse_refusal(message);
          const bool arm = vigil::is_arm_action(id(pending_action));
          if (arm && !refusal.text.empty()) {
            vigil::ctx.message = refusal.text;
            vigil::ctx.refused_action = (refusal.forceable && !vigil::ctx.force) ? id(pending_action) : 0;
            vigil::ctx.force = false;
            id(keypad_open) = false;
            id(pending_action) = 0;
          } else {
            vigil::ctx.message = vigil::localize_error(message, arm ? vigil::tr(vigil::arm_mode_name(id(pending_action))) : std::string());
          }
      - lvgl.textarea.update:
          id: pin_text
          text: ""
      - if:
          condition:
            lambda: return id(keypad_open);
          then:
            - lambda: lv_obj_set_style_text_color(id(lbl_kp_err), lv_color_hex(0xF0605D), 0);
            - lvgl.label.update:
                id: lbl_kp_err
                text: !lambda 'return vigil::ctx.message;'
          else:
            - lvgl.page.show: page_main
      - script.execute: refresh_ui
      - script.execute: clear_message

  - id: clear_message
    mode: restart
    then:
      - delay: 8s
      - lambda: |-
          vigil::ctx.message = "";
          vigil::ctx.refused_action = 0;
          lv_obj_set_style_text_color(id(lbl_kp_err), lv_color_hex(0x8A94A6), 0);
      - lvgl.label.update:
          id: lbl_kp_err
          text: !lambda 'return id(keypad_open) ? vigil::keypad_hint(id(pending_action)) : std::string("");'
      - script.execute: refresh_ui

# --------------------------------------------------------------------------------------- screen
# The look of Vigil: dark ground, calm cards, one colour per state (see vigil_panel.h). The sizes follow the size of
# the screen (the substitutions at the top), the main page is a column that grows with the screen, so a wider panel
# is a matter of a hardware file, not of this one.
