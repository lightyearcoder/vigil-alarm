        - button:
            id: btn_force
            width: 100%
            height: ${mode_h}
            radius: 22
            bg_color: 0x000000
            border_width: 2
            border_color: 0xF2B84B
            shadow_width: 0
            hidden: true
            pressed:
              bg_color: 0x2A2210
            on_click:
              then:
                - lambda: |-
                    vigil::ctx.force = true;
                    id(pending_action) = vigil::ctx.refused_action;
                    id(pending_entity) = "";
                - script.execute: start_action
            layout:
