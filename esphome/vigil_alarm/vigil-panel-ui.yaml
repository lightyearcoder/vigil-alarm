                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 6
                  widgets:
                    - obj:
                        width: 44
                        height: 44
                        radius: 22
                        bg_color: 0x14282B
                        border_width: 0
                        shadow_width: 0
                        pad_all: 0
                        clickable: false
                        scrollable: false
                        widgets:
                          - label:
                              text: "\U000F001D"
                              text_font: font_icons_30
                              text_color: 0x4FC3C9
                              align: CENTER
                    - label:
                        id: lbl_btn_vacation
                        text: "Vacation"
                        text_font: montserrat_20
                        text_color: 0xE8ECF2
              - button:
                  id: btn_custom
                  height: 100%
                  flex_grow: 1
                  radius: 22
                  bg_color: 0x151A22
                  border_width: 1
                  border_color: 0x232A35
                  shadow_width: 0
                  pressed:
                    bg_color: 0x1E2631
                  on_click:
                    then:
                      - lambda: |-
                          id(pending_action) = vigil::ARM_CUSTOM;
                          id(pending_entity) = "";
