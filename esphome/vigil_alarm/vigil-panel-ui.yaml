                    flex_align_track: CENTER
                    pad_row: 6
                  widgets:
                    - obj:
                        width: 44
                        height: 44
                        radius: 22
                        bg_color: 0x211E3A
                        border_width: 0
                        shadow_width: 0
                        pad_all: 0
                        clickable: false
                        scrollable: false
                        widgets:
                          - label:
                              text: "\U000F0594"
                              text_font: font_icons_30
                              text_color: 0x9A8CF2
                              align: CENTER
                    - label:
                        id: lbl_btn_night
                        text: "Night"
                        text_font: montserrat_20
                        text_color: 0xE8ECF2
              - button:
                  id: btn_vacation
                  height: 100%
                  flex_grow: 1
                  radius: 22
                  bg_color: 0x151A22
                  border_width: 1
                  border_color: 0x232A35
                  shadow_width: 0
                  pressed:
