                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 6
                  widgets:
                    - obj:
                        width: 44
                        height: 44
                        radius: 22
                        bg_color: 0x2D1E33
                        border_width: 0
                        shadow_width: 0
                        pad_all: 0
                        clickable: false
                        scrollable: false
                        widgets:
                          - label:
                              text: "\U000F062E"
                              text_font: font_icons_30
                              text_color: 0xD58BDD
                              align: CENTER
                    - label:
                        id: lbl_btn_custom
                        text: "Custom"
                        text_font: montserrat_20
                        text_color: 0xE8ECF2
        # Disarm: one wide button of its own, as wide as the card above it
        - button:
            id: btn_disarm
            width: 100%
            height: ${mode_h}
            radius: 22
            bg_color: 0x000000
            border_width: 2
            border_color: 0x4CCB8F
            shadow_width: 0
            pressed:
              bg_color: 0x14281F
            on_click:
              then:
                - lambda: |-
                    id(pending_action) = vigil::DISARM;
                    id(pending_entity) = "";
                - script.execute: start_action
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_column: 10
            widgets:
              - label:
                  text: "\U000F0FC7"
                  text_font: font_icons_30
                  text_color: 0x4CCB8F
              - label:
                  id: lbl_btn_disarm
                  text: "Disarm"
                  text_font: montserrat_28
                  text_color: 0x4CCB8F
        # Bypass and arm: after a refusal that bypassing can solve, in the place of the tiles
        - button:
            id: btn_force
            width: 100%
            height: ${mode_h}
            radius: 22
            bg_color: 0x000000
            border_width: 2
            border_color: 0xF2B84B
            shadow_width: 0
            hidden: true
            pressed:
              bg_color: 0x2A2210
            on_click:
              then:
                - lambda: |-
                    vigil::ctx.force = true;
                    id(pending_action) = vigil::ctx.refused_action;
                    id(pending_entity) = "";
                - script.execute: start_action
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_column: 10
            widgets:
              - label:
                  id: lbl_btn_force
                  text: "Bypass and arm"
                  text_font: montserrat_20
                  text_color: 0xF2B84B
        # The space of the tabs: they are in the top layer, so they stay put on every page
        - obj:
            width: 100%
            height: ${nav_h}
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
