# The tag reader function: what happens when a tag is held in front of the reader. It does not know pins or boards:
# the hardware file of the board (hardware/) defines the reader `vigil_reader`, this file adds the action to it. The same
# file serves a separate reader (hardware/esp32-s3-super-mini-tagreader.yaml) and, later, a panel that has a reader of its
# own. Add it to the device file next to the hardware file:
#
#   packages:
#     hardware: !include vigil_alarm/hardware/esp32-s3-super-mini-tagreader.yaml
#     tagreader: !include vigil_alarm/vigil-tagreader.yaml
#
# What a scan does:
#   - the tag goes to Home Assistant (Settings > Tags), so you can name it there;
#   - the reader fires the event `esphome.vigil_tag` with its own name (`name` of the device), its key (`reader_key`, see
#     your own file: the same key as a panel has) and the number. Vigil finds the reader (in the tab Panels: the name of
#     this device) and the user who has the tag, and arms or disarms with the rights of that reader;
#   - the three leds flash once, at once, and the buzzer (if there is one) beeps, whatever Vigil makes of the tag.
# The leds show the state of the alarm of the reader, which the reader reads from the sensor that Vigil makes for it: the
# device name with underscores, plus `_state` (`vigil-tagreader-home` reads `sensor.vigil_tagreader_home_state`). Which partition
# that is, is set once, in Vigil (the form of the reader), and not here. Green: off. Amber, slow: the exit delay (faster in its last 5 seconds). Red: armed away. Amber: armed home or
# night. Red, fast: entry delay (faster in its last 10 seconds). Red and amber in turn: alarm. Amber, short flash now and then: no state (Home
# Assistant is not there yet or the entity does not exist).
# Red, three short flashes (and three low beeps): Vigil refused the scan (an unknown tag, a wrong or missing key, a locked
# reader, not allowed). The buzzer beeps with the flashing of the exit delay (faster in its last 5 seconds) and of the entry
# delay (faster in its last 10 seconds), like the beeps of a panel.

substitutions:
  reader_key: ""   # the key that Vigil made for this reader (the key button in Vigil): see your own file
  state_entity: sensor.${ name | replace("-", "_") }_state
  # What the reader tells Vigil about itself, like a panel does: "<major>.<minor>" (the major number is what the reader and
  # Vigil say to each other: READER_VERSION in Vigil; the minor number goes up with every other change) and the hardware.
  firmware_version: "1.1"
  buzzer_on: "true"       # "false": the buzzer stays silent
  hardware_id: esp32-s3-super-mini-tagreader

logger:
  logs:
    # The PN532 component tries to read NDEF data from a Mifare Classic tag after it has read the number, and logs an
    # error ("Authentication failed - Block 0x04") when the tag has no NDEF data. The number is read all the same.
    pn532.mifare_classic: NONE

pn532_i2c:
  id: vigil_reader
  on_tag:
    then:
      - script.execute: led_flash
      - script.execute:
          id: beep
          freq: 2400
          ms: 60
      - homeassistant.tag_scanned: !lambda 'return x;'
      - homeassistant.event:
          event: esphome.vigil_tag
          data:
            reader: ${name}
            key: ${reader_key}
            tag: !lambda 'return x;'

binary_sensor:
  # Home Assistant shows whether the reader is there (Vigil reports a reader that is away, like a panel). Without any
  # entity the reader would show nothing at all in Home Assistant.
  - platform: status
    name: Status
    entity_category: diagnostic

globals:
  - id: refused_seen         # the counter of refused scans as Vigil last said it (-1: not known yet)
    type: int
    initial_value: '-1'
  - id: delay_until          # the moment (millis) the exit or entry delay ends, from the seconds Vigil says are left
    type: uint32_t
    initial_value: '0'

sensor:
  # Vigil counts the scans it refused (unknown tag, wrong or missing key, locked, not allowed). When the number goes up
  # the reader flashes red. The first number after a connection is only noted, so a restart does not flash.
  - platform: homeassistant
    id: refused_count
    entity_id: ${state_entity}
    attribute: refused
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !isnan(x) && id(refused_seen) >= 0 && (int32_t) x != id(refused_seen);'
            then:
              - script.execute: led_refused
        - lambda: 'if (!isnan(x)) id(refused_seen) = (int32_t) x;'
  - platform: homeassistant
    id: delay_left
    entity_id: ${state_entity}
    attribute: delay_left
    internal: true
    on_value:
      then:
        - lambda: 'id(delay_until) = isnan(x) ? 0 : millis() + (uint32_t)(x * 1000.0f);'

text_sensor:
  # What this reader says about itself, under the same names as a panel, so Vigil can show it and see old firmware.
  - platform: template
    name: Hardware ID
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return std::string("${hardware_id}");'
  - platform: template
    name: Capabilities
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return std::string("pn532,leds");'
  - platform: template
    name: Firmware version
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return std::string("${firmware_version}");'
  - platform: template
    name: Profile version
    entity_category: diagnostic
    update_interval: 1h
    lambda: 'return std::string("${ firmware_version.split(".")[0] }");'
  - platform: homeassistant
    id: alarm_state
    entity_id: ${state_entity}
    internal: true
    on_value:
      then:
        - logger.log:
            format: "State of ${state_entity}: %s"
            args: ['x.c_str()']
        - script.execute:
            id: led_show
            state: !lambda 'return x;'

esphome:
  on_boot:
    priority: -100
    then:
      - script.execute:
          id: led_show
          state: "unknown"

api:
  on_client_disconnected:
    then:
      - lambda: 'id(refused_seen) = -1;'
      - script.execute:
          id: led_show
          state: "unknown"

script:
  # The leds for a state of the alarm. A new state stops the old pattern.
  - id: led_show
    mode: restart
    parameters:
      state: string
    then:
      - output.turn_off: led_green
      - output.turn_off: led_amber
      - output.turn_off: led_red
      - if:
          condition:
            lambda: 'return state == "disarmed";'
          then:
            - output.turn_on: led_green
      - if:
          condition:
            lambda: 'return state == "armed_away" || state == "armed_vacation";'
          then:
            - output.turn_on: led_red
      - if:
          condition:
            lambda: 'return state == "armed_home" || state == "armed_night" || state == "armed_custom_bypass";'
          then:
            - output.turn_on: led_amber
      - if:
          condition:
            lambda: 'return state == "arming";'
          then:
            - while:
                condition:
                  lambda: 'return true;'
                then:
                  # the last 5 seconds of the exit delay faster, as the beep of a panel does
                  - output.turn_on: led_amber
                  - script.execute:
                      id: beep
                      freq: 2000
                      ms: 60
                  - if:
                      condition:
                        lambda: 'int32_t left = (int32_t)(id(delay_until) - millis()); return left > 0 && left <= 5000;'
                      then:
                        - delay: 200ms
                        - output.turn_off: led_amber
                        - delay: 200ms
                      else:
                        - delay: 600ms
                        - output.turn_off: led_amber
                        - delay: 600ms
      - if:
          condition:
            lambda: 'return state == "pending";'
          then:
            - while:
                condition:
                  lambda: 'return true;'
                then:
                  # the last 10 seconds of the entry delay faster
                  - output.turn_on: led_red
                  - script.execute:
                      id: beep
                      freq: 2600
                      ms: 60
                  - if:
                      condition:
                        lambda: 'int32_t left = (int32_t)(id(delay_until) - millis()); return left > 0 && left <= 10000;'
                      then:
                        - delay: 120ms
                        - output.turn_off: led_red
                        - delay: 120ms
                      else:
                        - delay: 300ms
                        - output.turn_off: led_red
                        - delay: 300ms
      - if:
          condition:
            lambda: 'return state == "triggered";'
          then:
            - while:
                condition:
                  lambda: 'return true;'
                then:
                  - output.turn_on: led_red
                  - output.turn_off: led_amber
                  - delay: 250ms
                  - output.turn_off: led_red
                  - output.turn_on: led_amber
                  - delay: 250ms
      - if:
          condition:
            lambda: 'return state == "unknown" || state == "unavailable" || state == "";'
          then:
            - while:
                condition:
                  lambda: 'return true;'
                then:
                  - output.turn_on: led_amber
                  - delay: 100ms
                  - output.turn_off: led_amber
                  - delay: 2s

  # A tag was seen: all leds flash once, then the state comes back.
  - id: led_flash
    mode: restart
    then:
      - script.stop: led_show
      - output.turn_on: led_green
      - output.turn_on: led_amber
      - output.turn_on: led_red
      - delay: 200ms
      - script.execute:
          id: led_show
          state: !lambda 'return id(alarm_state).state;'

  # A scan was refused by Vigil: red flashes three times, then the state comes back.
  - id: led_refused
    mode: restart
    then:
      - script.stop: led_show
      - script.stop: led_flash
      - output.turn_off: led_green
      - output.turn_off: led_amber
      - repeat:
          count: 3
          then:
            - output.turn_on: led_red
            - script.execute:
                id: beep
                freq: 1000
                ms: 150
            - delay: 150ms
            - output.turn_off: led_red
            - delay: 150ms
      - script.execute:
          id: led_show
          state: !lambda 'return id(alarm_state).state;'

  # One beep of the buzzer (nothing happens without one, or with buzzer_on "false"). A new beep stops the old one.
  - id: beep
    mode: restart
    parameters:
      freq: int
      ms: int
    then:
      - if:
          condition:
            lambda: 'return ${buzzer_on};'
          then:
            - output.ledc.set_frequency:
                id: buzzer
                frequency: !lambda 'return (float) freq;'
            - output.set_level:
                id: buzzer
                level: 50%
            - delay: !lambda 'return ms;'
            - output.set_level:
                id: buzzer
                level: 0%
