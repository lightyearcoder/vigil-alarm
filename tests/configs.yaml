# Shared test configuration: a small house.
house:
  version: 1
  default_entry_delay: 30
  modes:
    home: {exit_delay: 0}
    away: {exit_delay: 60}
    night: {exit_delay: 10}
  sensors:
    front_door:
      cls: intrusion
      type: delayed
      modes: [home, away, night]
      entry_delay: {home: 30, away: 30, night: 15}
      at_arm_open: bypass
    back_door:
      cls: intrusion
      type: delayed
      modes: [away, night]
      entry_delay: 15
      at_arm_open: bypass
    garage_door:
      cls: intrusion
      type: delayed
      modes: [away]
      entry_delay: 20
      at_arm_open: pending
    hallway_pir:
      cls: intrusion
      type: follower
      modes: [away]
      at_arm_open: wait_clear
    living_pir:
      cls: intrusion
      type: instant
      modes: [away]
      at_arm_open: wait_clear
    kitchen_pir:
      cls: intrusion
      type: instant
      modes: [away]
      at_arm_open: wait_clear
    bedroom_pir:
      cls: intrusion
      type: instant
      modes: [away]
      at_arm_open: wait_clear
    window_living:
      cls: intrusion
      type: instant
      modes: [home, away, night]
      at_arm_open: refuse
    cellar_window:
      cls: intrusion
      type: instant
      modes: [away]
      at_arm_open: refuse
      on_unavailable: trigger
    smoke_hall: {cls: fire}
    gas_kitchen: {cls: gas, gas_type: natural_gas}
    co_living: {cls: gas, gas_type: co}
    tamper_siren: {cls: tamper}
    water_kitchen: {cls: water}
    water_bath: {cls: water}
  rules:
    downstairs:
      sensors: [living_pir, kitchen_pir]
      required: 2
      window: 60
